name: Community+ tests

on:
  push:
    branches:
      - main
      - 'community-plus/**'
    paths:
      - 'server/communityplus/**'
      - 'ee/pkg/hostidentity/types/**'
      - 'ee/server/service/hostidentity/httpsig/**'
      - 'ee/server/service/digicert/**'
      - 'ee/server/service/scep/**'
      - 'ee/server/service/hostidentity/**'
      - 'ee/server/service/condaccess/**'
      - 'ee/maintained-apps/**'
      - 'server/mdm/maintainedapps/**'
      - 'cmd/maintained-apps/**'
      - 'server/communityplus/calendarload/**'
      - 'tools/calendar/**'
      - 'ee/orbit/**'
      - 'orbit/cmd/fetch_cert/**'
      - 'orbit/cmd/orbit/**'
      - 'ee/server/licensing/**'
      - 'ee/fleetctl/**'
      - 'ee/server/calendar/**'
      - 'ee/server/googleworkspace/**'
      - 'ee/server/scim/**'
      - 'ee/server/service/**'
      - 'ee/server/webhooks/**'
      - 'server/vulnerabilities/nvd/tools/cvefeed/**'
      - '.github/workflows/community-plus-tests.yml'
  pull_request:
    paths:
      - 'server/communityplus/**'
      - 'ee/pkg/hostidentity/types/**'
      - 'ee/server/service/hostidentity/httpsig/**'
      - 'ee/server/service/digicert/**'
      - 'ee/server/service/scep/**'
      - 'ee/server/service/hostidentity/**'
      - 'ee/server/service/condaccess/**'
      - 'ee/maintained-apps/**'
      - 'server/mdm/maintainedapps/**'
      - 'cmd/maintained-apps/**'
      - 'server/communityplus/calendarload/**'
      - 'tools/calendar/**'
      - 'ee/orbit/**'
      - 'orbit/cmd/fetch_cert/**'
      - 'orbit/cmd/orbit/**'
      - 'ee/server/licensing/**'
      - 'ee/fleetctl/**'
      - 'ee/server/calendar/**'
      - 'ee/server/googleworkspace/**'
      - 'ee/server/scim/**'
      - 'ee/server/service/**'
      - 'ee/server/webhooks/**'
      - 'server/vulnerabilities/nvd/tools/cvefeed/**'
      - '.github/workflows/community-plus-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(find server/communityplus server/mdm/maintainedapps ee/pkg/hostidentity/types ee/server/service/hostidentity/httpsig ee/server/service/digicert ee/server/service/scep ee/maintained-apps ee/server/licensing ee/fleetctl -name '*.go' -type f -print)"
          test -n "$files"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo 'The following files need gofmt:'
            echo "$unformatted"
            exit 1
          fi

      - name: Test Community+
        run: >-
          go test -race
          ./server/communityplus/...
          ./ee/pkg/hostidentity/types
          ./ee/server/service/hostidentity/httpsig
          ./ee/server/service/digicert
          ./ee/server/service/scep
          ./ee/server/service/hostidentity/...
          ./ee/server/service/condaccess/...
          ./ee/maintained-apps
          ./ee/maintained-apps/ingesters/source
          ./server/mdm/maintainedapps
          ./ee/server/licensing
          ./ee/fleetctl
          ./ee/server/calendar
          ./ee/server/googleworkspace
          ./ee/server/scim
          ./ee/server/service
          ./ee/server/service/est
          ./ee/server/webhooks
          ./server/vulnerabilities/nvd/tools/cvefeed/...

      - name: Build fleetctl
        run: go build ./cmd/fleetctl/fleetctl

      - name: Build Fleet server
        run: go build ./cmd/fleet

      - name: Build auxiliary tools
        run: go build ./cmd/maintained-apps ./tools/calendar

      - name: Validate Community+ maintained app catalog
        run: go run ./cmd/maintained-apps --check

      - name: Build Orbit binaries
        run: go build ./orbit/cmd/fetch_cert ./orbit/cmd/orbit
