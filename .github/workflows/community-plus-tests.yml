name: Community+ tests

on:
  push:
    branches:
      - main
      - 'community-plus/**'
    paths:
      - 'server/communityplus/**'
      - 'ee/pkg/hostidentity/types/**'
      - 'ee/server/service/hostidentity/httpsig/**'
      - 'ee/server/service/digicert/**'
      - 'ee/server/service/scep/**'
      - 'ee/server/service/hostidentity/**'
      - 'ee/server/service/condaccess/**'
      - 'ee/maintained-apps/**'
      - 'ee/server/licensing/**'
      - 'ee/fleetctl/**'
      - 'server/vulnerabilities/nvd/tools/cvefeed/**'
      - '.github/workflows/community-plus-tests.yml'
  pull_request:
    paths:
      - 'server/communityplus/**'
      - 'ee/pkg/hostidentity/types/**'
      - 'ee/server/service/hostidentity/httpsig/**'
      - 'ee/server/service/digicert/**'
      - 'ee/server/service/scep/**'
      - 'ee/server/service/hostidentity/**'
      - 'ee/server/service/condaccess/**'
      - 'ee/maintained-apps/**'
      - 'ee/server/licensing/**'
      - 'ee/fleetctl/**'
      - 'server/vulnerabilities/nvd/tools/cvefeed/**'
      - '.github/workflows/community-plus-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          files="$(find server/communityplus ee/pkg/hostidentity/types ee/server/service/hostidentity/httpsig ee/server/service/digicert ee/server/service/scep ee/maintained-apps ee/server/licensing ee/fleetctl -name '*.go' -type f -print)"
          test -n "$files"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo 'The following files need gofmt:'
            echo "$unformatted"
            exit 1
          fi

      - name: Test Community+
        run: >-
          go test -race
          ./server/communityplus/...
          ./ee/pkg/hostidentity/types
          ./ee/server/service/hostidentity/httpsig
          ./ee/server/service/digicert
          ./ee/server/service/scep
          ./ee/server/service/hostidentity/...
          ./ee/server/service/condaccess/...
          ./ee/maintained-apps
          ./ee/server/licensing
          ./ee/fleetctl
          ./server/vulnerabilities/nvd/tools/cvefeed/...

      - name: Build fleetctl
        run: go build ./cmd/fleetctl/fleetctl
