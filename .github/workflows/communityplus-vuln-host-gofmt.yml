name: Community+ vulnerability host gofmt

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-vuln-host-gofmt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format vulnerability host reporting
        run: |
          set -euo pipefail
          gofmt -w server/communityplus/servicecompat/vulnerabilities.go
          git diff --check
      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/communityplus/servicecompat/vulnerabilities.go
          git commit -m 'style: gofmt Community+ vulnerability host reporting'
          git push origin HEAD:community-plus/foundation
