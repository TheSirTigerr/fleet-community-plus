name: Community+ profile label scope v1

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-profile-label-scope-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Remove only profile label scope license gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {actual}')
              p.write_text(text.replace(old, new, expected))

          def replace_after(path, marker, old, new):
              p = Path(path)
              text = p.read_text()
              marker_idx = text.find(marker)
              if marker_idx < 0:
                  raise SystemExit(f'{path}: marker not found: {marker!r}')
              match_idx = text.find(old, marker_idx)
              if match_idx < 0:
                  raise SystemExit(f'{path}: replacement after marker not found: {marker!r}')
              p.write_text(text[:match_idx] + new + text[match_idx + len(old):])

          common = (
              '\tif len(labelsInclude) > 0 || len(labelsExcludeAny) > 0 {\n'
              '\t\tif lic == nil || !lic.IsPremium() {\n'
              '\t\t\treturn nil, nil, "", ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for profile label scoping")\n'
              '\t\t}\n'
              '\t}\n'
          )
          replace_exact('server/service/apple_mdm.go', common, '', 1)
          replace_exact('server/service/windows_mdm_profiles.go', common, '', 1)

          declaration = (
              '\tif len(labelsInclude) > 0 || len(labelsExcludeAny) > 0 {\n'
              '\t\tif lic == nil || !lic.IsPremium() {\n'
              '\t\t\treturn nil, nil, "", ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for declaration profile label scoping")\n'
              '\t\t}\n'
              '\t}\n'
          )
          replace_exact('server/service/apple_mdm.go', declaration, '', 1)

          android_parse = (
              '\tif len(labelsInclude) > 0 || len(labelsExcludeAny) > 0 {\n'
              '\t\tif lic == nil || !lic.IsPremium() {\n'
              '\t\t\treturn nil, "", ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for profile label scoping")\n'
              '\t\t}\n'
              '\t}\n'
          )
          replace_exact('server/service/mdm.go', android_parse, '', 1)
          replace_exact(
              'server/service/mdm.go',
              '\tlic, _ := license.FromContext(ctx)\n\tvar teamName string\n',
              '\tvar teamName string\n',
              1,
          )

          labels_only = (
              '\tif len(labelsInclude) > 0 || len(labelsExcludeAny) > 0 {\n'
              '\t\tlic, err := svc.License(ctx)\n'
              '\t\tif err != nil {\n'
              '\t\t\treturn ctxerr.Wrap(ctx, err, "checking license")\n'
              '\t\t}\n'
              '\t\tif lic == nil || !lic.IsPremium() {\n'
              '\t\t\treturn ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for profile label scoping")\n'
              '\t\t}\n'
              '\t}\n'
          )
          replace_exact('server/service/mdm.go', labels_only, '', 1)

          batch = (
              '\tif len(labels) > 0 && (lic == nil || !lic.IsPremium()) {\n'
              '\t\treturn ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for profile label scoping")\n'
              '\t}\n'
          )
          replace_exact('server/service/mdm.go', batch, '', 1)

          # Apple create regression: free/community+ may scope profiles by labels.
          old_apple_test = ''.join([
              '\t// Fails on free license with labels\n',
              '\tmcBytes = mcBytesForTest("Foo", "identifier", "UUID")\n',
              '\tsvc, ctx, _, _ = setup(t, &fleet.LicenseInfo{Tier: fleet.TierFree}, "identifier")\n',
              '\t_, err = svc.NewMDMAppleConfigProfile(ctx, 0, mcBytes, []string{"test-label"}, fleet.LabelsIncludeAll, nil)\n',
              '\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\trequire.ErrorContains(t, err, "Scoping configuration profiles")\n',
              '\n',
              '\t_, err = svc.NewMDMAppleConfigProfile(ctx, 0, mcBytes, nil, fleet.LabelsIncludeAll, []string{"test-label"})\n',
              '\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\trequire.ErrorContains(t, err, "Scoping configuration profiles")\n',
          ])
          new_apple_test = ''.join([
              '\t// Label targeting is available on Community+.\n',
              '\tmcBytes = mcBytesForTest("Foo", "identifier", "UUID")\n',
              '\tsvc, ctx, ds, _ := setup(t, &fleet.LicenseInfo{Tier: fleet.TierFree}, "identifier")\n',
              '\tds.LabelsByNameFunc = func(_ context.Context, labels []string, _ fleet.TeamFilter) (map[string]*fleet.Label, error) {\n',
              '\t\trequire.Equal(t, []string{"test-label"}, labels)\n',
              '\t\treturn map[string]*fleet.Label{"test-label": {ID: 1, Name: "test-label"}}, nil\n',
              '\t}\n',
              '\tds.LabelIDsByNameFunc = func(_ context.Context, labels []string, _ fleet.TeamFilter) (map[string]uint, error) {\n',
              '\t\trequire.Equal(t, []string{"test-label"}, labels)\n',
              '\t\treturn map[string]uint{"test-label": 1}, nil\n',
              '\t}\n',
              '\t_, err = svc.NewMDMAppleConfigProfile(ctx, 0, mcBytes, []string{"test-label"}, fleet.LabelsIncludeAll, nil)\n',
              '\trequire.NoError(t, err)\n',
              '\n',
              '\t_, err = svc.NewMDMAppleConfigProfile(ctx, 0, mcBytes, nil, fleet.LabelsIncludeAll, []string{"test-label"})\n',
              '\trequire.NoError(t, err)\n',
          ])
          replace_exact('server/service/apple_mdm_test.go', old_apple_test, new_apple_test, 1)

          update_func_apple_old = ''.join([
              '\tds.UpdateMDMAppleConfigProfileFunc = func(ctx context.Context, p fleet.MDMAppleConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAppleConfigProfile, error) {\n',
              '\t\tt.Fatal("should not reach the datastore update")\n',
              '\t\treturn nil, nil\n',
              '\t}\n',
          ])
          update_func_apple_new = ''.join([
              '\tds.UpdateMDMAppleConfigProfileFunc = func(ctx context.Context, p fleet.MDMAppleConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAppleConfigProfile, error) {\n',
              '\t\treturn &p, nil\n',
              '\t}\n',
          ])
          apple_marker = '\tt.Run("labels require a premium license, content-only edits do not", func(t *testing.T) {'
          replace_after('server/service/apple_mdm_test.go', apple_marker, update_func_apple_old, update_func_apple_new)
          replace_after(
              'server/service/apple_mdm_test.go', apple_marker,
              '\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n\trequire.ErrorContains(t, err, "Scoping configuration profiles")\n',
              '\trequire.NoError(t, err)\n',
          )
          replace_exact('server/service/apple_mdm_test.go', apple_marker, '\tt.Run("label and content edits succeed on a free license", func(t *testing.T) {', 1)
          apple_team_marker = '\tt.Run("team-scoped content update succeeds on a free license", func(t *testing.T) {'
          replace_after(
              'server/service/apple_mdm_test.go', apple_team_marker,
              '\t// Label scoping remains a separate Community+ roadmap capability.\n\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\t// Label scoping is also available on Community+.\n\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\trequire.NoError(t, err)\n',
          )

          # Windows update regressions.
          update_func_windows_old = ''.join([
              '\tds.UpdateMDMWindowsConfigProfileFunc = func(ctx context.Context, p fleet.MDMWindowsConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMWindowsConfigProfile, error) {\n',
              '\t\tt.Fatal("should not reach the datastore update")\n',
              '\t\treturn nil, nil\n',
              '\t}\n',
          ])
          update_func_windows_new = ''.join([
              '\tds.UpdateMDMWindowsConfigProfileFunc = func(ctx context.Context, p fleet.MDMWindowsConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMWindowsConfigProfile, error) {\n',
              '\t\treturn &p, nil\n',
              '\t}\n',
          ])
          windows_marker = '\tt.Run("labels require a premium license, content-only edits do not", func(t *testing.T) {'
          replace_after('server/service/windows_mdm_profiles_test.go', windows_marker, update_func_windows_old, update_func_windows_new)
          replace_after(
              'server/service/windows_mdm_profiles_test.go', windows_marker,
              '\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n\trequire.ErrorContains(t, err, "Scoping configuration profiles with labels requires Fleet Premium license")\n',
              '\trequire.NoError(t, err)\n',
          )
          replace_exact('server/service/windows_mdm_profiles_test.go', windows_marker, '\tt.Run("label and content edits succeed on a free license", func(t *testing.T) {', 1)
          windows_team_marker = '\tt.Run("team-scoped content update succeeds on a free license", func(t *testing.T) {'
          replace_after(
              'server/service/windows_mdm_profiles_test.go', windows_team_marker,
              '\t// Label scoping remains a separate Community+ roadmap capability.\n\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\t// Label scoping is also available on Community+.\n\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\trequire.NoError(t, err)\n',
          )

          # Android update regressions.
          update_func_android_old = ''.join([
              '\tds.UpdateMDMAndroidConfigProfileFunc = func(ctx context.Context, p fleet.MDMAndroidConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAndroidConfigProfile, error) {\n',
              '\t\tt.Fatal("should not reach the datastore update")\n',
              '\t\treturn nil, nil\n',
              '\t}\n',
          ])
          update_func_android_new = ''.join([
              '\tds.UpdateMDMAndroidConfigProfileFunc = func(ctx context.Context, p fleet.MDMAndroidConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAndroidConfigProfile, error) {\n',
              '\t\treturn &p, nil\n',
              '\t}\n',
          ])
          android_marker = '\tt.Run("labels require a premium license, content-only edits do not", func(t *testing.T) {'
          replace_after('server/service/mdm_test.go', android_marker, update_func_android_old, update_func_android_new)
          replace_after(
              'server/service/mdm_test.go', android_marker,
              '\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n\trequire.ErrorContains(t, err, "Scoping configuration profiles with labels requires Fleet Premium license")\n',
              '\trequire.NoError(t, err)\n',
          )
          replace_exact('server/service/mdm_test.go', android_marker, '\tt.Run("label and content edits succeed on a free license", func(t *testing.T) {', 1)
          android_team_marker = '\tt.Run("team-scoped update on a free license allows content but not label scoping", func(t *testing.T) {'
          replace_after(
              'server/service/mdm_test.go', android_team_marker,
              '\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\trequire.NoError(t, err)\n',
          )
          replace_exact(
              'server/service/mdm_test.go', android_team_marker,
              '\tt.Run("team-scoped content and label updates succeed on a free license", func(t *testing.T) {', 1,
          )

          # Batch/GitOps profile targeting needs real label IDs/names and should
          # now succeed on free/community+ just like the API paths.
          batch_test_marker = 'func TestMDMBatchSetProfiles(t *testing.T) {'
          list_assets = ''.join([
              '\tds.ListAppleDDMAssetsFunc = func(ctx context.Context, teamID *uint) ([]*fleet.DDMAsset, error) {\n',
              '\t\treturn nil, nil\n',
              '\t}\n',
          ])
          batch_label_mocks = list_assets + ''.join([
              '\tds.LabelIDsByNameFunc = func(_ context.Context, labels []string, _ fleet.TeamFilter) (map[string]uint, error) {\n',
              '\t\tresult := make(map[string]uint, len(labels))\n',
              '\t\tfor i, name := range labels { result[name] = uint(i + 1) }\n',
              '\t\treturn result, nil\n',
              '\t}\n',
              '\tds.LabelsByNameFunc = func(_ context.Context, labels []string, _ fleet.TeamFilter) (map[string]*fleet.Label, error) {\n',
              '\t\tresult := make(map[string]*fleet.Label, len(labels))\n',
              '\t\tfor i, name := range labels { result[name] = &fleet.Label{ID: uint(i + 1), Name: name} }\n',
              '\t\treturn result, nil\n',
              '\t}\n',
          ])
          replace_after('server/service/mdm_test.go', batch_test_marker, list_assets, batch_label_mocks)
          for old_name, new_name in [
              ('profiles with include all labels fails on free license', 'profiles with include all labels succeed on free license'),
              ('profiles with include any labels fails on free license', 'profiles with include any labels succeed on free license'),
              ('profiles with exclude labels fails on free license', 'profiles with exclude labels succeed on free license'),
          ]:
              marker = f'\t\t\t"{old_name}",'
              replace_exact('server/service/mdm_test.go', marker, f'\t\t\t"{new_name}",', 1)
              replace_after(
                  'server/service/mdm_test.go', f'\t\t\t"{new_name}",',
                  '\t\t\t"Scoping configuration profiles with labels requires Fleet Premium license",\n\t\t\ttrue,\n',
                  '\t\t\t"",\n\t\t\tfalse,\n',
              )

          for path, expected in [
              ('server/service/apple_mdm.go', 0),
              ('server/service/windows_mdm_profiles.go', 0),
              ('server/service/mdm.go', 0),
          ]:
              remaining = Path(path).read_text().count('ConfigProfileLabelScopingPremiumCauseMsg')
              if remaining != expected:
                  raise SystemExit(f'{path}: expected {expected} label-license references after patch, got {remaining}')
          PY
          gofmt -w \
            server/service/apple_mdm.go \
            server/service/windows_mdm_profiles.go \
            server/service/mdm.go \
            server/service/apple_mdm_test.go \
            server/service/windows_mdm_profiles_test.go \
            server/service/mdm_test.go
          git diff --check
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Verify profile label scope changes
        shell: bash
        run: |
          set -euo pipefail
          go test ./server/service -run '^(TestNewMDMAppleConfigProfile|TestUpdateMDMAppleConfigProfile|TestUpdateMDMWindowsConfigProfile|TestUpdateMDMAndroidConfigProfile|TestNewMDMProfilePremiumOnlyAndroid|TestMDMBatchSetAppleProfiles|TestMDMBatchSetProfiles|TestBatchSetMDMProfilesLabels)$' -count=1
          go build ./cmd/fleet
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/service/apple_mdm.go \
            server/service/windows_mdm_profiles.go \
            server/service/mdm.go \
            server/service/apple_mdm_test.go \
            server/service/windows_mdm_profiles_test.go \
            server/service/mdm_test.go
          git commit -m 'feat: enable Community+ profile label targeting'
          git push origin HEAD:community-plus/foundation
