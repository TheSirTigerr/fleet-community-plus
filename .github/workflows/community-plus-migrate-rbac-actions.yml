name: Community+ migrate RBAC actions

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/community-plus-migrate-rbac-actions.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
      - name: Separate configuration and execution permissions
        shell: python
        run: |
          from pathlib import Path

          api = Path('server/communityplus/httpapi.go')
          text = api.read_text()
          old = 'Request{Resource: ResourceSoftware, Action: ActionAdmin, Scope: GlobalScope()}'
          if text.count(old) != 2:
              raise SystemExit(f'expected two global software admin checks, found {text.count(old)}')
          text = text.replace(old, 'Request{Resource: ResourceSoftware, Action: ActionWrite, Scope: GlobalScope()}')
          old = 'Request{Resource: ResourceSoftware, Action: ActionWrite, Scope: deployment.Scope}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one deployment write check, found {text.count(old)}')
          text = text.replace(old, 'Request{Resource: ResourceSoftware, Action: ActionExecute, Scope: deployment.Scope}')
          api.write_text(text)

          tests = Path('server/communityplus/httpapi_test.go')
          text = tests.read_text()
          old_test = '''func TestHTTPAPICapabilitiesRequireGlobalAccess(t *testing.T) {
          \trole, err := ObserverRole(3)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tapi, _, _ := newTestHTTPAPI(t, roleAccessController{actor: "observer", roles: []Role{role}})
          \treq := httptest.NewRequest(http.MethodGet, "/api/v1/fleet/communityplus/capabilities", nil)
          \trecorder := httptest.NewRecorder()
          \tapi.Handler().ServeHTTP(recorder, req)
          \tif recorder.Code != http.StatusForbidden {
          \t\tt.Fatalf("expected forbidden, status=%d body=%s", recorder.Code, recorder.Body.String())
          \t}
          }
          '''
          new_test = '''func TestHTTPAPICapabilitiesAllowTeamObserverRead(t *testing.T) {
          \trole, err := ObserverRole(3)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tapi, _, _ := newTestHTTPAPI(t, roleAccessController{actor: "observer", roles: []Role{role}})
          \treq := httptest.NewRequest(http.MethodGet, "/api/v1/fleet/communityplus/capabilities", nil)
          \trecorder := httptest.NewRecorder()
          \tapi.Handler().ServeHTTP(recorder, req)
          \tif recorder.Code != http.StatusOK {
          \t\tt.Fatalf("expected observer to read capabilities, status=%d body=%s", recorder.Code, recorder.Body.String())
          \t}
          }
          '''
          if old_test not in text:
              raise SystemExit('capabilities observer test block not found')
          tests.write_text(text.replace(old_test, new_test, 1))
      - name: Format files
        run: gofmt -w server/communityplus/httpapi.go server/communityplus/httpapi_test.go server/communityplus/rbac_fleet_roles.go server/communityplus/rbac_fleet_roles_test.go server/communityplus/viewer_roles.go server/communityplus/routes_test.go
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/communityplus/httpapi.go server/communityplus/httpapi_test.go server/communityplus/rbac_fleet_roles.go server/communityplus/rbac_fleet_roles_test.go server/communityplus/viewer_roles.go server/communityplus/routes_test.go
          git diff --cached --quiet || git commit -m 'feat: separate Community+ RBAC write and execute actions'
          git push origin HEAD:community-plus/foundation
