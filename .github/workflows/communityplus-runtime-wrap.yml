name: Community+ runtime service wiring

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-runtime-wrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Wire Community+ service on Free runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cmd/fleet/serve.go')
          text = p.read_text()

          old_vars = (
              '\tvar softwareInstallStore fleet.SoftwareInstallerStore\n'
              '\tvar bootstrapPackageStore fleet.MDMBootstrapPackageStore\n'
              '\tvar softwareTitleIconStore fleet.SoftwareTitleIconStore\n'
              '\tvar distributedLock fleet.Lock\n'
              '\tif license.IsPremium() {\n'
          )
          new_vars = (
              '\tvar softwareInstallStore fleet.SoftwareInstallerStore\n'
              '\tvar bootstrapPackageStore fleet.MDMBootstrapPackageStore\n'
              '\tvar softwareTitleIconStore fleet.SoftwareTitleIconStore\n'
              '\tvar distributedLock fleet.Lock\n\n'
              '\t// Community+ uses Fleet\'s free license identity. Initialize the bootstrap\n'
              '\t// package object store independently of Fleet Premium so S3-backed bootstrap\n'
              '\t// packages honor the configured storage backend in production.\n'
              '\tif !license.IsPremium() && config.S3.SoftwareInstallersBucket != "" {\n'
              '\t\tbstore, err := s3.NewBootstrapPackageStore(config.S3)\n'
              '\t\tif err != nil {\n'
              '\t\t\tinitFatal(err, "initializing Community+ S3 bootstrap package store")\n'
              '\t\t}\n'
              '\t\tbootstrapPackageStore = bstore\n'
              '\t\tlogger.InfoContext(ctx, "using Community+ S3 bootstrap package store", "bucket", config.S3.SoftwareInstallersBucket)\n'
              '\t}\n\n'
              '\tif license.IsPremium() {\n'
          )
          if text.count(old_vars) != 1:
              raise SystemExit(f'expected one store declaration block, got {text.count(old_vars)}')
          text = text.replace(old_vars, new_vars, 1)

          old_tail = (
              '\t\tif err != nil {\n'
              '\t\t\tinitFatal(err, "initial Fleet Premium service")\n'
              '\t\t}\n'
              '\t}\n\n'
              '\tinstanceID, err := server.GenerateRandomText(64)\n'
          )
          new_tail = (
              '\t\tif err != nil {\n'
              '\t\t\tinitFatal(err, "initial Fleet Premium service")\n'
              '\t\t}\n'
              '\t}\n\n'
              '\t// Community+ capabilities are edition features, not Fleet Premium license\n'
              '\t// features. Layer them onto the Community service when running with the\n'
              '\t// normal Free license identity. Dev-Premium keeps the existing path above.\n'
              '\tif !license.IsPremium() {\n'
              '\t\tsvc, err = eeservice.NewService(\n'
              '\t\t\tsvc,\n'
              '\t\t\tds,\n'
              '\t\t\tlogger,\n'
              '\t\t\tdepStorage,\n'
              '\t\t\tbootstrapPackageStore,\n'
              '\t\t\tpsso.NewRedisNonceStore(redisPool),\n'
              '\t\t)\n'
              '\t\tif err != nil {\n'
              '\t\t\tinitFatal(err, "initial Community+ service")\n'
              '\t\t}\n'
              '\t}\n\n'
              '\tinstanceID, err := server.GenerateRandomText(64)\n'
          )
          if text.count(old_tail) != 1:
              raise SystemExit(f'expected one premium service tail, got {text.count(old_tail)}')
          p.write_text(text.replace(old_tail, new_tail, 1))
          PY
          gofmt -w cmd/fleet/serve.go
          git diff --check
          go test ./server/communityplus/...
          go build ./cmd/fleet
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Commit verified runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd/fleet/serve.go
          git commit -m 'fix: wire Community+ services on Free runtime'
          git push origin HEAD:community-plus/foundation
