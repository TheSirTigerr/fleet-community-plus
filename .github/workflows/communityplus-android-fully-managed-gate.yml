name: Community+ Android fully-managed token gate

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-android-fully-managed-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Preserve fully-managed intent in enrollment token data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/mdm/android/service/service.go')
          text = p.read_text()
          old = '''enrollmentTokenRequest, err := json.Marshal(enrollmentTokenRequest{\n\t\tEnrollSecret: enrollSecret,\n\t\tIdpUUID:      idpUUID,\n\t})'''
          new = '''enrollmentTokenRequest, err := json.Marshal(enrollmentTokenRequest{\n\t\tEnrollSecret: enrollSecret,\n\t\tFullyManaged: fullyManaged,\n\t\tIdpUUID:      idpUUID,\n\t})'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one enrollment token marshal block, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

          cat > server/mdm/android/service/communityplus_fully_managed_test.go <<'EOF'
          package service

          import (
          	"context"
          	"encoding/json"
          	"io"
          	"log/slog"
          	"testing"

          	"github.com/fleetdm/fleet/v4/server/config"
          	"github.com/fleetdm/fleet/v4/server/fleet"
          	"github.com/fleetdm/fleet/v4/server/mdm/android"
          	android_mock "github.com/fleetdm/fleet/v4/server/mdm/android/mock"
          	"github.com/stretchr/testify/require"
          	"google.golang.org/api/androidmanagement/v1"
          )

          func TestCreateEnrollmentTokenCarriesFullyManagedFlag(t *testing.T) {
          	client := android_mock.Client{}
          	client.InitCommonMocks()

          	ds := InitCommonDSMocks()
          	ds.Store.AppConfigFunc = func(context.Context) (*fleet.AppConfig, error) {
          		return &fleet.AppConfig{MDM: fleet.MDM{AndroidEnabledAndConfigured: true}}, nil
          	}
          	ds.Store.VerifyEnrollSecretFunc = func(context.Context, string) (*fleet.EnrollSecret, error) {
          		return &fleet.EnrollSecret{Secret: "secret"}, nil
          	}
          	ds.Store.GetEnterpriseFunc = func(context.Context) (*android.Enterprise, error) {
          		return &android.Enterprise{EnterpriseID: "test-enterprise"}, nil
          	}

          	var created *androidmanagement.EnrollmentToken
          	client.EnterprisesEnrollmentTokensCreateFunc = func(_ context.Context, _ string, token *androidmanagement.EnrollmentToken) (*androidmanagement.EnrollmentToken, error) {
          		created = token
          		return &androidmanagement.EnrollmentToken{Value: "token", QrCode: "qr"}, nil
          	}

          	logger := slog.New(slog.NewTextHandler(io.Discard, nil))
          	svc, err := NewServiceWithClient(logger, ds, &client, "test-private-key", &ds.DataStore, noopNewActivity, config.AndroidAgentConfig{})
          	require.NoError(t, err)

          	_, err = svc.CreateEnrollmentToken(t.Context(), "secret", "", true)
          	require.NoError(t, err)
          	require.NotNil(t, created)
          	require.Equal(t, "PERSONAL_USAGE_DISALLOWED", created.AllowPersonalUsage)

          	var additional enrollmentTokenRequest
          	require.NoError(t, json.Unmarshal([]byte(created.AdditionalData), &additional))
          	require.Equal(t, "secret", additional.EnrollSecret)
          	require.True(t, additional.FullyManaged)
          }
          EOF

          gofmt -w server/mdm/android/service/service.go server/mdm/android/service/communityplus_fully_managed_test.go
          git diff --check
          go test ./server/mdm/android/service -run '^TestCreateEnrollmentTokenCarriesFullyManagedFlag$'
          go test ./server/mdm/android/service/...
          go build ./cmd/fleet

          rm .github/workflows/communityplus-android-fully-managed-gate.yml
          git diff --check

      - name: Commit verified fully-managed enrollment fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve Android fully-managed enrollment intent'
          git push origin HEAD:community-plus/foundation
