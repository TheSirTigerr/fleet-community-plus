name: Community+ MDM migration gate

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-mdm-migration-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Enable Community+ MDM migration config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/service/appconfig.go')
          text = p.read_text()
          old = (
              '\t\tif mdm.MacOSMigration.Enable {\n'
              '\t\t\tif !lic.IsPremium() {\n'
              '\t\t\t\tinvalid.Append("macos_migration.enable", ErrMissingLicense.Error())\n'
              '\t\t\t\treturn nil\n'
              '\t\t\t}\n'
              '\t\t\tif !mdm.MacOSMigration.Mode.IsValid() {\n'
          )
          new = (
              '\t\tif mdm.MacOSMigration.Enable {\n'
              '\t\t\t// Community+ implements the macOS MDM migration workflow independently;\n'
              '\t\t\t// do not gate this configuration on a Fleet Premium license token.\n'
              '\t\t\tif !mdm.MacOSMigration.Mode.IsValid() {\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one macOS migration license gate, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w server/service/appconfig.go
          git diff --check
          go test ./server/communityplus/... ./server/service -run 'TestNonExistent' -count=0
          go build ./cmd/fleet
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Commit verified migration gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/appconfig.go
          git commit -m 'fix: allow Community+ MDM migration configuration'
          git push origin HEAD:community-plus/foundation
