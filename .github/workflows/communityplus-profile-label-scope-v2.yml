name: Community+ profile label scope v2

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-profile-label-scope-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch label targeting and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {n}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          def after(path, marker, old, new):
              p = Path(path)
              text = p.read_text()
              m = text.find(marker)
              if m < 0:
                  raise SystemExit(f'{path}: marker missing: {marker!r}')
              i = text.find(old, m)
              if i < 0:
                  raise SystemExit(f'{path}: replacement missing after {marker!r}: {old[:80]!r}')
              p.write_text(text[:i] + new + text[i + len(old):])

          gate_common = (
              '\tif len(labelsInclude) > 0 || len(labelsExcludeAny) > 0 {\n'
              '\t\tif lic == nil || !lic.IsPremium() {\n'
              '\t\t\treturn nil, nil, "", ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for profile label scoping")\n'
              '\t\t}\n\t}\n'
          )
          exact('server/service/apple_mdm.go', gate_common, '')
          exact('server/service/windows_mdm_profiles.go', gate_common, '')
          exact('server/service/apple_mdm.go', (
              '\tif len(labelsInclude) > 0 || len(labelsExcludeAny) > 0 {\n'
              '\t\tif lic == nil || !lic.IsPremium() {\n'
              '\t\t\treturn nil, nil, "", ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for declaration profile label scoping")\n'
              '\t\t}\n\t}\n'
          ), '')
          exact('server/service/mdm.go', (
              '\tif len(labelsInclude) > 0 || len(labelsExcludeAny) > 0 {\n'
              '\t\tif lic == nil || !lic.IsPremium() {\n'
              '\t\t\treturn nil, "", ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for profile label scoping")\n'
              '\t\t}\n\t}\n'
          ), '')
          exact('server/service/mdm.go', '\tlic, _ := license.FromContext(ctx)\n\tvar teamName string\n', '\tvar teamName string\n')
          exact('server/service/mdm.go', (
              '\tif len(labelsInclude) > 0 || len(labelsExcludeAny) > 0 {\n'
              '\t\tlic, err := svc.License(ctx)\n'
              '\t\tif err != nil {\n\t\t\treturn ctxerr.Wrap(ctx, err, "checking license")\n\t\t}\n'
              '\t\tif lic == nil || !lic.IsPremium() {\n'
              '\t\t\treturn ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for profile label scoping")\n'
              '\t\t}\n\t}\n'
          ), '')
          exact('server/service/mdm.go', (
              '\tif len(labels) > 0 && (lic == nil || !lic.IsPremium()) {\n'
              '\t\treturn ctxerr.Wrap(ctx, fleet.NewLicenseErrorWithCause(fleet.ConfigProfileLabelScopingPremiumCauseMsg), "checking license for profile label scoping")\n\t}\n'
          ), '')

          # New Apple profile on Free/Community+.
          old = ''.join([
              '\t// Fails on free license with labels\n',
              '\tmcBytes = mcBytesForTest("Foo", "identifier", "UUID")\n',
              '\tsvc, ctx, _, _ = setup(t, &fleet.LicenseInfo{Tier: fleet.TierFree}, "identifier")\n',
              '\t_, err = svc.NewMDMAppleConfigProfile(ctx, 0, mcBytes, []string{"test-label"}, fleet.LabelsIncludeAll, nil)\n',
              '\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\trequire.ErrorContains(t, err, "Scoping configuration profiles")\n\n',
              '\t_, err = svc.NewMDMAppleConfigProfile(ctx, 0, mcBytes, nil, fleet.LabelsIncludeAll, []string{"test-label"})\n',
              '\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\trequire.ErrorContains(t, err, "Scoping configuration profiles")\n',
          ])
          new = ''.join([
              '\t// Label targeting is available on Community+.\n',
              '\tmcBytes = mcBytesForTest("Foo", "identifier", "UUID")\n',
              '\tsvc, ctx, ds, _ := setup(t, &fleet.LicenseInfo{Tier: fleet.TierFree}, "identifier")\n',
              '\tds.LabelsByNameFunc = func(_ context.Context, labels []string, _ fleet.TeamFilter) (map[string]*fleet.Label, error) {\n',
              '\t\treturn map[string]*fleet.Label{"test-label": &fleet.Label{ID: 1, Name: "test-label"}}, nil\n\t}\n',
              '\tds.LabelIDsByNameFunc = func(_ context.Context, labels []string, _ fleet.TeamFilter) (map[string]uint, error) {\n',
              '\t\treturn map[string]uint{"test-label": 1}, nil\n\t}\n',
              '\t_, err = svc.NewMDMAppleConfigProfile(ctx, 0, mcBytes, []string{"test-label"}, fleet.LabelsIncludeAll, nil)\n',
              '\trequire.NoError(t, err)\n\n',
              '\t_, err = svc.NewMDMAppleConfigProfile(ctx, 0, mcBytes, nil, fleet.LabelsIncludeAll, []string{"test-label"})\n',
              '\trequire.NoError(t, err)\n',
          ])
          exact('server/service/apple_mdm_test.go', old, new)

          def enable_update(path, marker, update_type, premium_message):
              fatal = ''.join([
                  f'\t\tds.Update{update_type}Func = func(ctx context.Context, p fleet.{update_type.removeprefix("MDM")}, usesFleetVars []fleet.FleetVarName) (*fleet.{update_type.removeprefix("MDM")}, error) {{\n',
                  '\t\t\tt.Fatal("should not reach the datastore update")\n',
                  '\t\t\treturn nil, nil\n\t\t}\n',
              ])
              # Signatures differ by type naming, so callers below provide literal blocks instead.

          apple_marker = '\tt.Run("labels require a premium license, content-only edits do not", func(t *testing.T) {'
          after('server/service/apple_mdm_test.go', apple_marker,
              '\t\tds.UpdateMDMAppleConfigProfileFunc = func(ctx context.Context, p fleet.MDMAppleConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAppleConfigProfile, error) {\n\t\t\tt.Fatal("should not reach the datastore update")\n\t\t\treturn nil, nil\n\t\t}\n',
              '\t\tds.UpdateMDMAppleConfigProfileFunc = func(ctx context.Context, p fleet.MDMAppleConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAppleConfigProfile, error) {\n\t\t\treturn &p, nil\n\t\t}\n')
          after('server/service/apple_mdm_test.go', apple_marker,
              '\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n\t\trequire.ErrorContains(t, err, "Scoping configuration profiles")\n',
              '\t\trequire.NoError(t, err)\n')
          exact('server/service/apple_mdm_test.go', apple_marker, '\tt.Run("label and content edits succeed on a free license", func(t *testing.T) {')
          apple_team = '\tt.Run("team-scoped content update succeeds on a free license", func(t *testing.T) {'
          after('server/service/apple_mdm_test.go', apple_team,
              '\t\t// Label scoping remains a separate Community+ roadmap capability.\n\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\t\t// Label scoping is also available on Community+.\n\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\t\trequire.NoError(t, err)\n')

          windows_marker = '\tt.Run("labels require a premium license, content-only edits do not", func(t *testing.T) {'
          after('server/service/windows_mdm_profiles_test.go', windows_marker,
              '\t\tds.UpdateMDMWindowsConfigProfileFunc = func(ctx context.Context, p fleet.MDMWindowsConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMWindowsConfigProfile, error) {\n\t\t\tt.Fatal("should not reach the datastore update")\n\t\t\treturn nil, nil\n\t\t}\n',
              '\t\tds.UpdateMDMWindowsConfigProfileFunc = func(ctx context.Context, p fleet.MDMWindowsConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMWindowsConfigProfile, error) {\n\t\t\treturn &p, nil\n\t\t}\n')
          after('server/service/windows_mdm_profiles_test.go', windows_marker,
              '\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n\t\trequire.ErrorContains(t, err, "Scoping configuration profiles with labels requires Fleet Premium license")\n',
              '\t\trequire.NoError(t, err)\n')
          exact('server/service/windows_mdm_profiles_test.go', windows_marker, '\tt.Run("label and content edits succeed on a free license", func(t *testing.T) {')
          windows_team = '\tt.Run("team-scoped content update succeeds on a free license", func(t *testing.T) {'
          after('server/service/windows_mdm_profiles_test.go', windows_team,
              '\t\t// Label scoping remains a separate Community+ roadmap capability.\n\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\t\t// Label scoping is also available on Community+.\n\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\t\trequire.NoError(t, err)\n')

          android_marker = '\tt.Run("labels require a premium license, content-only edits do not", func(t *testing.T) {'
          after('server/service/mdm_test.go', android_marker,
              '\t\tds.UpdateMDMAndroidConfigProfileFunc = func(ctx context.Context, p fleet.MDMAndroidConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAndroidConfigProfile, error) {\n\t\t\tt.Fatal("should not reach the datastore update")\n\t\t\treturn nil, nil\n\t\t}\n',
              '\t\tds.UpdateMDMAndroidConfigProfileFunc = func(ctx context.Context, p fleet.MDMAndroidConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAndroidConfigProfile, error) {\n\t\t\treturn &p, nil\n\t\t}\n')
          after('server/service/mdm_test.go', android_marker,
              '\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n\t\trequire.ErrorContains(t, err, "Scoping configuration profiles with labels requires Fleet Premium license")\n',
              '\t\trequire.NoError(t, err)\n')
          exact('server/service/mdm_test.go', android_marker, '\tt.Run("label and content edits succeed on a free license", func(t *testing.T) {')
          android_team = '\tt.Run("team-scoped update on a free license allows content but not label scoping", func(t *testing.T) {'
          after('server/service/mdm_test.go', android_team,
              '\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n',
              '\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n\t\trequire.NoError(t, err)\n')
          exact('server/service/mdm_test.go', android_team, '\tt.Run("team-scoped content and label updates succeed on a free license", func(t *testing.T) {')

          batch_marker = 'func TestMDMBatchSetProfiles(t *testing.T) {'
          assets_block = '\tds.ListAppleDDMAssetsFunc = func(ctx context.Context, teamID *uint) ([]*fleet.DDMAsset, error) {\n\t\treturn nil, nil\n\t}\n'
          after('server/service/mdm_test.go', batch_marker, assets_block, assets_block + (
              '\tds.LabelIDsByNameFunc = func(_ context.Context, labels []string, _ fleet.TeamFilter) (map[string]uint, error) {\n'
              '\t\tresult := make(map[string]uint, len(labels))\n\t\tfor i, name := range labels {\n\t\t\tresult[name] = uint(i + 1)\n\t\t}\n\t\treturn result, nil\n\t}\n'
              '\tds.LabelsByNameFunc = func(_ context.Context, labels []string, _ fleet.TeamFilter) (map[string]*fleet.Label, error) {\n'
              '\t\tresult := make(map[string]*fleet.Label, len(labels))\n\t\tfor i, name := range labels {\n\t\t\tresult[name] = &fleet.Label{ID: uint(i + 1), Name: name}\n\t\t}\n\t\treturn result, nil\n\t}\n'
          ))
          for old_name, new_name in [
              ('profiles with include all labels fails on free license', 'profiles with include all labels succeed on free license'),
              ('profiles with include any labels fails on free license', 'profiles with include any labels succeed on free license'),
              ('profiles with exclude labels fails on free license', 'profiles with exclude labels succeed on free license'),
          ]:
              exact('server/service/mdm_test.go', f'\t\t\t"{old_name}",', f'\t\t\t"{new_name}",')
              after('server/service/mdm_test.go', f'\t\t\t"{new_name}",',
                  '\t\t\t"Scoping configuration profiles with labels requires Fleet Premium license",\n\t\t\ttrue,\n',
                  '\t\t\t"",\n\t\t\tfalse,\n')

          for p in ('server/service/apple_mdm.go', 'server/service/windows_mdm_profiles.go', 'server/service/mdm.go'):
              if 'ConfigProfileLabelScopingPremiumCauseMsg' in Path(p).read_text():
                  raise SystemExit(f'{p}: label scope license reference remains')
          PY
          gofmt -w server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go \
            server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Verify label targeting
        shell: bash
        run: |
          set -euo pipefail
          go test ./server/service -run '^(TestNewMDMAppleConfigProfile|TestUpdateMDMAppleConfigProfile|TestUpdateMDMWindowsConfigProfile|TestUpdateMDMAndroidConfigProfile|TestNewMDMProfilePremiumOnlyAndroid|TestMDMBatchSetAppleProfiles|TestMDMBatchSetProfiles|TestBatchSetMDMProfilesLabels)$' -count=1
          go build ./cmd/fleet
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go \
            server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git commit -m 'feat: enable Community+ profile label targeting'
          git push origin HEAD:community-plus/foundation
