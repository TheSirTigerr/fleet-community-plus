name: Community+ self-service gofmt

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-selfservice-gofmt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format self-service implementation
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            server/communityplus/selfservice.go \
            server/communityplus/selfservice_test.go \
            server/service/hosts.go \
            server/service/software_installers.go \
            server/datastore/mysql/migrations/tables/20261006090000_AddCommunityPlusSelfService.go
          git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/communityplus/selfservice.go \
            server/communityplus/selfservice_test.go \
            server/service/hosts.go \
            server/service/software_installers.go \
            server/datastore/mysql/migrations/tables/20261006090000_AddCommunityPlusSelfService.go
          git commit -m 'style: gofmt Community+ self-service'
          git push origin HEAD:community-plus/foundation
