name: Bootstrap Fleet Community base

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-fleet-community
  cancel-in-progress: false

jobs:
  import-community-base:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Fleet upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/fleetdm/fleet.git /tmp/fleet-upstream
          git -C /tmp/fleet-upstream rev-parse HEAD > /tmp/fleet-upstream-sha

      - name: Import source-available Community tree only
        shell: bash
        run: |
          set -euo pipefail

          preserve_dir="$(mktemp -d)"
          cp README.md "$preserve_dir/README.md"
          mkdir -p "$preserve_dir/docs" "$preserve_dir/.github/workflows"
          cp docs/CLEAN_ROOM.md "$preserve_dir/docs/CLEAN_ROOM.md"
          cp docs/FEATURE_PARITY.md "$preserve_dir/docs/FEATURE_PARITY.md"
          cp .github/workflows/bootstrap-fleet-community.yml \
            "$preserve_dir/.github/workflows/bootstrap-fleet-community.yml"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='ee/' \
            --exclude='.github/workflows/' \
            --exclude='README.md' \
            --exclude='docs/CLEAN_ROOM.md' \
            --exclude='docs/FEATURE_PARITY.md' \
            /tmp/fleet-upstream/ ./

          cp "$preserve_dir/README.md" README.md
          mkdir -p docs .github/workflows
          cp "$preserve_dir/docs/CLEAN_ROOM.md" docs/CLEAN_ROOM.md
          cp "$preserve_dir/docs/FEATURE_PARITY.md" docs/FEATURE_PARITY.md
          cp "$preserve_dir/.github/workflows/bootstrap-fleet-community.yml" \
            .github/workflows/bootstrap-fleet-community.yml

          rm -rf ee
          if [ -e ee ]; then
            echo 'ERROR: ee/ still exists after import.' >&2
            exit 1
          fi

          upstream_sha="$(cat /tmp/fleet-upstream-sha)"
          cat > COMMUNITY_PLUS_UPSTREAM.md <<'EOF'
          # Fleet Community Plus upstream base

          This repository was bootstrapped from the public `fleetdm/fleet` repository.

          UPSTREAM_COMMIT_PLACEHOLDER

          The upstream `ee/` directory is intentionally excluded. Fleet's root license
          applies to the imported files according to their paths; documentation and
          third-party components retain their respective upstream licenses.

          Premium-equivalent functionality in this repository must be implemented
          independently and must not copy Fleet's restricted Enterprise Edition backend.
          EOF
          sed -i "s/UPSTREAM_COMMIT_PLACEHOLDER/Upstream commit: ${upstream_sha}/" COMMUNITY_PLUS_UPSTREAM.md

      - name: Verify import boundaries
        shell: bash
        run: |
          set -euo pipefail

          test ! -e ee
          test -f README.md
          test -f docs/CLEAN_ROOM.md
          test -f docs/FEATURE_PARITY.md
          test -f .github/workflows/bootstrap-fleet-community.yml
          test -f COMMUNITY_PLUS_UPSTREAM.md

          workflow_count="$(find .github/workflows -maxdepth 1 -type f | wc -l)"
          if [ "$workflow_count" -ne 1 ]; then
            echo "ERROR: unexpected upstream workflows were imported." >&2
            find .github/workflows -maxdepth 1 -type f -print >&2
            exit 1
          fi

      - name: Commit imported Community base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'chore: bootstrap Fleet Community upstream base'
          git push origin HEAD:main
