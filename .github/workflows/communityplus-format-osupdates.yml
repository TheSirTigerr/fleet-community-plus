name: Community+ OS update formatter

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-format-osupdates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format OS update implementation
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            server/communityplus/osupdates/service.go \
            server/communityplus/osupdates/service_test.go \
            server/communityplus/servicecompat/overrides.go
          git diff --check
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/communityplus/osupdates server/communityplus/servicecompat/overrides.go
          git commit -m 'style: format Community+ OS update implementation'
          git push origin HEAD:community-plus/foundation
