name: Community+ configuration profile scope ungate

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-config-profiles-ungate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Remove only fleet-scope profile license gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def function_chunk(path, marker):
              p = Path(path)
              text = p.read_text()
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"{path}: missing marker {marker}")
              end = text.find("\nfunc ", start + len(marker))
              if end < 0:
                  end = len(text)
              return p, text, start, end, text[start:end]

          def replace_in_function(path, marker, old, new):
              p, text, start, end, chunk = function_chunk(path, marker)
              actual = chunk.count(old)
              if actual != 1:
                  raise SystemExit(f"{path} {marker}: expected 1 match, got {actual}")
              chunk = chunk.replace(old, new, 1)
              p.write_text(text[:start] + chunk + text[end:])

          def replace_test_block(path, start_marker, end_marker, replacement):
              p = Path(path)
              text = p.read_text()
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{path}: missing test marker {start_marker}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{path}: missing following test marker {end_marker}")
              p.write_text(text[:start] + replacement + text[end:])

          team_gate = (
              "\tif teamID > 0 {\n"
              "\t\tif lic == nil || !lic.IsPremium() {\n"
              "\t\t\treturn nil, nil, \"\", ctxerr.Wrap(ctx, fleet.ErrMissingLicense)\n"
              "\t\t}\n"
              "\t\ttm, err := svc.EnterpriseOverrides.TeamByIDOrName(ctx, &teamID, nil)\n"
              "\t\tif err != nil {\n"
              "\t\t\treturn nil, nil, \"\", ctxerr.Wrap(ctx, err)\n"
              "\t\t}\n"
              "\t\tteamName = tm.Name\n"
              "\t}\n"
          )
          team_free = (
              "\tif teamID > 0 {\n"
              "\t\ttm, err := svc.ds.TeamLite(ctx, teamID)\n"
              "\t\tif err != nil {\n"
              "\t\t\treturn nil, nil, \"\", ctxerr.Wrap(ctx, err)\n"
              "\t\t}\n"
              "\t\tteamName = tm.Name\n"
              "\t}\n"
          )
          replace_in_function(
              "server/service/apple_mdm.go",
              "func (svc *Service) parseAndValidateAppleConfigProfile",
              team_gate,
              team_free,
          )
          replace_in_function(
              "server/service/windows_mdm_profiles.go",
              "func (svc *Service) parseAndValidateWindowsConfigProfile",
              team_gate,
              team_free,
          )

          old_resolve = (
              "\tlic, err := svc.License(ctx)\n"
              "\tif err != nil {\n"
              "\t\treturn 0, \"\", ctxerr.Wrap(ctx, err, \"checking license\")\n"
              "\t}\n"
              "\tif lic == nil || !lic.IsPremium() {\n"
              "\t\treturn 0, \"\", ctxerr.Wrap(ctx, fleet.ErrMissingLicense)\n"
              "\t}\n"
              "\ttm, err := svc.EnterpriseOverrides.TeamByIDOrName(ctx, &tmID, nil)\n"
              "\tif err != nil {\n"
              "\t\treturn 0, \"\", ctxerr.Wrap(ctx, err)\n"
              "\t}\n"
          )
          new_resolve = (
              "\ttm, err := svc.ds.TeamLite(ctx, tmID)\n"
              "\tif err != nil {\n"
              "\t\treturn 0, \"\", ctxerr.Wrap(ctx, err)\n"
              "\t}\n"
          )
          replace_in_function(
              "server/service/mdm.go",
              "func (svc *Service) resolveProfileTeam",
              old_resolve,
              new_resolve,
          )

          apple_test = (
              "\tt.Run(\"team-scoped content update succeeds on a free license\", func(t *testing.T) {\n"
              "\t\tsvc, ctx, ds, _ := setup(t, &fleet.LicenseInfo{Tier: fleet.TierFree})\n"
              "\t\texisting := newExistingProfile(\"com.fleetdm.test\", \"Test Profile\", 5)\n\n"
              "\t\tds.GetMDMAppleConfigProfileFunc = func(ctx context.Context, puid string) (*fleet.MDMAppleConfigProfile, error) {\n"
              "\t\t\treturn existing, nil\n"
              "\t\t}\n"
              "\t\tds.TeamLiteFunc = func(ctx context.Context, tid uint) (*fleet.TeamLite, error) {\n"
              "\t\t\trequire.Equal(t, uint(5), tid)\n"
              "\t\t\treturn &fleet.TeamLite{ID: tid, Name: \"Test Team\"}, nil\n"
              "\t\t}\n"
              "\t\tds.UpdateMDMAppleConfigProfileFunc = func(ctx context.Context, p fleet.MDMAppleConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAppleConfigProfile, error) {\n"
              "\t\t\trequire.Equal(t, uint(5), ptr.ValOrZero(p.TeamID))\n"
              "\t\t\treturn &p, nil\n"
              "\t\t}\n\n"
              "\t\tmcBytes := mcBytesForTest(\"Test Profile\", \"com.fleetdm.test\", \"UUID\")\n"
              "\t\terr := svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, \"\", mcBytes, nil, fleet.LabelsIncludeAll, nil, optjson.Slice[byte]{})\n"
              "\t\trequire.NoError(t, err)\n\n"
              "\t\t// Label scoping remains a separate Community+ roadmap capability.\n"
              "\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, \"\", nil, []string{\"label1\"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n"
              "\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n"
              "\t})\n\n"
          )
          replace_test_block(
              "server/service/apple_mdm_test.go",
              "\tt.Run(\"team-scoped update on a free license returns a license error\"",
              "\tt.Run(\"authorization outcome matches user role and team membership\"",
              apple_test,
          )

          windows_test = (
              "\tt.Run(\"team-scoped content update succeeds on a free license\", func(t *testing.T) {\n"
              "\t\tsvc, ctx, ds, _ := setup(t, &fleet.LicenseInfo{Tier: fleet.TierFree})\n"
              "\t\texisting := newExistingProfile(\"Test Profile\", 5)\n\n"
              "\t\tds.GetMDMWindowsConfigProfileFunc = func(ctx context.Context, puid string) (*fleet.MDMWindowsConfigProfile, error) {\n"
              "\t\t\treturn existing, nil\n"
              "\t\t}\n"
              "\t\tds.TeamLiteFunc = func(ctx context.Context, tid uint) (*fleet.TeamLite, error) {\n"
              "\t\t\trequire.Equal(t, uint(5), tid)\n"
              "\t\t\treturn &fleet.TeamLite{ID: tid, Name: \"Test Team\"}, nil\n"
              "\t\t}\n"
              "\t\tds.UpdateMDMWindowsConfigProfileFunc = func(ctx context.Context, p fleet.MDMWindowsConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMWindowsConfigProfile, error) {\n"
              "\t\t\trequire.Equal(t, uint(5), ptr.ValOrZero(p.TeamID))\n"
              "\t\t\treturn &p, nil\n"
              "\t\t}\n\n"
              "\t\tsyncML := syncMLForTest(\"./Device/Vendor/MSFT/Policy/Config/Bluetooth/AllowDiscoverableMode\")\n"
              "\t\terr := svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, existing.Name, syncML, nil, fleet.LabelsIncludeAll, nil, optjson.Slice[byte]{})\n"
              "\t\trequire.NoError(t, err)\n\n"
              "\t\t// Label scoping remains a separate Community+ roadmap capability.\n"
              "\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, \"\", nil, []string{\"label1\"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})\n"
              "\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)\n"
              "\t})\n\n"
          )
          replace_test_block(
              "server/service/windows_mdm_profiles_test.go",
              "\tt.Run(\"team-scoped update on a free license returns a license error\"",
              "\tt.Run(\"Fleet variables used in the upload are threaded through to the datastore call\"",
              windows_test,
          )
          PY
          gofmt -w server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go
          git diff --check
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Verify profile scope changes
        shell: bash
        run: |
          set -euo pipefail
          go test ./server/communityplus/servicecompat -count=1
          go test ./server/service -run 'Test.*MDM.*Profile' -count=1
          go build ./cmd/fleet
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go
          git commit -m 'feat: enable Community+ configuration profile fleet scope'
          git push origin HEAD:community-plus/foundation
