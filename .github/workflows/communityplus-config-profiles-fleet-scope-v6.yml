name: Community+ configuration profile fleet scope v6

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-config-profiles-fleet-scope-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply consolidated fleet-scope patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/communityplus-config-profiles-fleet-scope-v5.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          exec(compile(textwrap.dedent(source[start:end]), 'fleet-scope-v5', 'exec'))

          p = Path('server/service/mdm_test.go')
          text = p.read_text()
          old = '''\tt.Run("team-scoped update on a free license returns a license error", func(t *testing.T) {
\t\t// team profiles can survive a premium-to-free downgrade; the update
\t\t// must fail with a license error, not panic on the nil
\t\t// EnterpriseOverrides that free servers never populate.
\t\tsvc, ctx, ds, _ := setup(t, &fleet.LicenseInfo{Tier: fleet.TierFree})
\t\texisting := newExistingProfile("Test Profile", 5)

\t\tds.GetMDMAndroidConfigProfileFunc = func(ctx context.Context, puid string) (*fleet.MDMAndroidConfigProfile, error) {
\t\t\treturn existing, nil
\t\t}
\t\tds.UpdateMDMAndroidConfigProfileFunc = func(ctx context.Context, p fleet.MDMAndroidConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAndroidConfigProfile, error) {
\t\t\tt.Fatal("should not reach the datastore update")
\t\t\treturn nil, nil
\t\t}

\t\tnewContent := []byte(`{"screenCaptureDisabled": false}`)
\t\terr := svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", newContent, nil, fleet.LabelsIncludeAll, nil, optjson.Slice[byte]{})
\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)

\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})
\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)
\t})
'''
          new = '''\tt.Run("team-scoped update on a free license allows content but not label scoping", func(t *testing.T) {
\t\tsvc, ctx, ds, _ := setup(t, &fleet.LicenseInfo{Tier: fleet.TierFree})
\t\texisting := newExistingProfile("Test Profile", 5)

\t\tds.GetMDMAndroidConfigProfileFunc = func(ctx context.Context, puid string) (*fleet.MDMAndroidConfigProfile, error) {
\t\t\treturn existing, nil
\t\t}
\t\tds.UpdateMDMAndroidConfigProfileFunc = func(ctx context.Context, p fleet.MDMAndroidConfigProfile, usesFleetVars []fleet.FleetVarName) (*fleet.MDMAndroidConfigProfile, error) {
\t\t\treturn &p, nil
\t\t}

\t\tnewContent := []byte(`{"screenCaptureDisabled": false}`)
\t\terr := svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", newContent, nil, fleet.LabelsIncludeAll, nil, optjson.Slice[byte]{})
\t\trequire.NoError(t, err)

\t\terr = svc.UpdateMDMConfigProfile(ctx, existing.ProfileUUID, "", nil, []string{"label1"}, fleet.LabelsIncludeAny, nil, optjson.Slice[byte]{})
\t\trequire.ErrorIs(t, err, fleet.ErrMissingLicense)
\t})
'''
          if text.count(old) != 1:
              raise SystemExit(f'Android free-team update test: expected 1 match, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git diff --check
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Verify fleet-scope profile changes
        shell: bash
        run: |
          set -euo pipefail
          go test ./server/communityplus/servicecompat -count=1
          go test ./server/service -run '^(TestUpdateMDMAppleConfigProfile|TestUpdateMDMWindowsConfigProfile|TestUpdateMDMAndroidConfigProfile|TestNewMDMProfilePremiumOnlyAndroid|TestMDMBatchSetAppleProfiles|TestMDMBatchSetProfiles|TestBatchSetMDMProfilesLabels|TestBatchSetMDMProfilesOSUpdates|TestUploadWindowsMDMConfigProfileValidations|TestDeleteMDMConfigProfileFreeLicenseTeam)$' -count=1
          go build ./cmd/fleet
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git commit -m 'feat: enable Community+ configuration profile fleet scope'
          git push origin HEAD:community-plus/foundation
