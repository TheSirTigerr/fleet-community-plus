name: Community+ PSSO gofmt

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-psso-gofmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format Apple PSSO files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w server/communityplus/applepsso/*.go server/communityplus/servicecompat/apple_psso.go
          git diff --check
          if git diff --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/communityplus/applepsso server/communityplus/servicecompat/apple_psso.go
          git commit -m 'style: gofmt Community+ Apple PSSO'
          git push origin HEAD:community-plus/foundation
