name: Community+ scope immutability migration

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/community-plus-scope-immutability.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
      - name: Enforce immutable resource scopes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sql = Path('server/communityplus/sqlstore.go')
          text = sql.read_text()

          old = '''\t_, err = s.db.ExecContext(ctx, `
          INSERT INTO communityplus_automation_rules
              (id, name, scope_kind, fleet_id, trigger_name, action_name, enabled, conditions, config)
          VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
          ON DUPLICATE KEY UPDATE
              name = VALUES(name), scope_kind = VALUES(scope_kind), fleet_id = VALUES(fleet_id),
              trigger_name = VALUES(trigger_name), action_name = VALUES(action_name),
              enabled = VALUES(enabled), conditions = VALUES(conditions), config = VALUES(config)`,
          \t\trule.ID, rule.Name, rule.Scope.Kind, fleetID, rule.Trigger, rule.Action,
          \t\trule.Enabled, conditions, config,
          \t)
          \tif err != nil {
          \t\treturn fmt.Errorf("communityplus: upsert automation rule: %w", err)
          \t}
          \treturn nil
          '''
          new = '''\t_, err = s.db.ExecContext(ctx, `
          INSERT INTO communityplus_automation_rules
              (id, name, scope_kind, fleet_id, trigger_name, action_name, enabled, conditions, config)
          VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
          ON DUPLICATE KEY UPDATE
              name = IF(scope_kind = VALUES(scope_kind) AND fleet_id <=> VALUES(fleet_id), VALUES(name), name),
              trigger_name = IF(scope_kind = VALUES(scope_kind) AND fleet_id <=> VALUES(fleet_id), VALUES(trigger_name), trigger_name),
              action_name = IF(scope_kind = VALUES(scope_kind) AND fleet_id <=> VALUES(fleet_id), VALUES(action_name), action_name),
              enabled = IF(scope_kind = VALUES(scope_kind) AND fleet_id <=> VALUES(fleet_id), VALUES(enabled), enabled),
              conditions = IF(scope_kind = VALUES(scope_kind) AND fleet_id <=> VALUES(fleet_id), VALUES(conditions), conditions),
              config = IF(scope_kind = VALUES(scope_kind) AND fleet_id <=> VALUES(fleet_id), VALUES(config), config)`,
          \t\trule.ID, rule.Name, rule.Scope.Kind, fleetID, rule.Trigger, rule.Action,
          \t\trule.Enabled, conditions, config,
          \t)
          \tif err != nil {
          \t\treturn fmt.Errorf("communityplus: upsert automation rule: %w", err)
          \t}

          \tvar storedKind ScopeKind
          \tvar storedFleetID sql.NullInt64
          \tif err := s.db.QueryRowContext(ctx, `SELECT scope_kind, fleet_id FROM communityplus_automation_rules WHERE id = ?`, rule.ID).Scan(&storedKind, &storedFleetID); err != nil {
          \t\treturn fmt.Errorf("communityplus: verify automation rule scope: %w", err)
          \t}
          \tstoredScope := Scope{Kind: storedKind}
          \tif storedFleetID.Valid {
          \t\tif storedFleetID.Int64 <= 0 {
          \t\t\treturn fmt.Errorf("communityplus: invalid stored automation fleet_id %d", storedFleetID.Int64)
          \t\t}
          \t\tstoredScope.FleetID = uint(storedFleetID.Int64)
          \t}
          \tif err := storedScope.Validate(); err != nil {
          \t\treturn fmt.Errorf("communityplus: validate stored automation scope: %w", err)
          \t}
          \tif storedScope != rule.Scope {
          \t\treturn fmt.Errorf("%w: automation rule %q", ErrScopeConflict, rule.ID)
          \t}
          \treturn nil
          '''
          if old not in text:
              raise SystemExit('automation upsert block not found')
          text = text.replace(old, new, 1)

          old = '''\t_, err := s.db.ExecContext(ctx, `
          INSERT INTO communityplus_catalog_deployments (id, catalog_entry_id, fleet_id, self_service, automatic_install, patch, created_at, created_by)
          VALUES (?, ?, ?, ?, ?, ?, ?, ?)
          ON DUPLICATE KEY UPDATE catalog_entry_id = VALUES(catalog_entry_id), fleet_id = VALUES(fleet_id), self_service = VALUES(self_service), automatic_install = VALUES(automatic_install), patch = VALUES(patch), created_at = VALUES(created_at), created_by = VALUES(created_by)`, deployment.ID, deployment.CatalogEntryID, deployment.Scope.FleetID, deployment.SelfService, deployment.Automatic, deployment.Patch, deployment.CreatedAt, deployment.CreatedBy)
          \tif err != nil {
          \t\treturn fmt.Errorf("communityplus: upsert catalog deployment: %w", err)
          \t}
          \treturn nil
          '''
          new = '''\t_, err := s.db.ExecContext(ctx, `
          INSERT INTO communityplus_catalog_deployments (id, catalog_entry_id, fleet_id, self_service, automatic_install, patch, created_at, created_by)
          VALUES (?, ?, ?, ?, ?, ?, ?, ?)
          ON DUPLICATE KEY UPDATE
              catalog_entry_id = IF(fleet_id = VALUES(fleet_id), VALUES(catalog_entry_id), catalog_entry_id),
              self_service = IF(fleet_id = VALUES(fleet_id), VALUES(self_service), self_service),
              automatic_install = IF(fleet_id = VALUES(fleet_id), VALUES(automatic_install), automatic_install),
              patch = IF(fleet_id = VALUES(fleet_id), VALUES(patch), patch),
              created_at = IF(fleet_id = VALUES(fleet_id), VALUES(created_at), created_at),
              created_by = IF(fleet_id = VALUES(fleet_id), VALUES(created_by), created_by)`, deployment.ID, deployment.CatalogEntryID, deployment.Scope.FleetID, deployment.SelfService, deployment.Automatic, deployment.Patch, deployment.CreatedAt, deployment.CreatedBy)
          \tif err != nil {
          \t\treturn fmt.Errorf("communityplus: upsert catalog deployment: %w", err)
          \t}

          \tvar storedFleetID uint
          \tif err := s.db.QueryRowContext(ctx, `SELECT fleet_id FROM communityplus_catalog_deployments WHERE id = ?`, deployment.ID).Scan(&storedFleetID); err != nil {
          \t\treturn fmt.Errorf("communityplus: verify catalog deployment scope: %w", err)
          \t}
          \tif storedFleetID != deployment.Scope.FleetID {
          \t\treturn fmt.Errorf("%w: catalog deployment %q", ErrScopeConflict, deployment.ID)
          \t}
          \treturn nil
          '''
          if old not in text:
              raise SystemExit('deployment upsert block not found')
          sql.write_text(text.replace(old, new, 1))

          api = Path('server/communityplus/httpapi.go')
          text = api.read_text()
          old = '''\tcase errors.Is(err, ErrForbidden):
          \t\tstatus = http.StatusForbidden
          \tcase strings.Contains(err.Error(), "invalid"), strings.Contains(err.Error(), "required"), strings.Contains(err.Error(), "must"):
          '''
          new = '''\tcase errors.Is(err, ErrForbidden):
          \t\tstatus = http.StatusForbidden
          \tcase errors.Is(err, ErrScopeConflict):
          \t\tstatus = http.StatusConflict
          \tcase strings.Contains(err.Error(), "invalid"), strings.Contains(err.Error(), "required"), strings.Contains(err.Error(), "must"):
          '''
          if old not in text:
              raise SystemExit('writeAPIError switch block not found')
          api.write_text(text.replace(old, new, 1))

          tests = Path('server/communityplus/sqlstore_test.go')
          text = tests.read_text()
          text = text.replace('''import (
          \t"context"
          \t"testing"
          ''', '''import (
          \t"context"
          \t"errors"
          \t"testing"
          ''', 1)
          old = '''\tmock.ExpectExec("INSERT INTO communityplus_automation_rules").
          \t\tWithArgs(
          \t\t\trule.ID, rule.Name, ScopeFleet, uint(12), rule.Trigger, rule.Action,
          \t\t\ttrue, sqlmock.AnyArg(), sqlmock.AnyArg(),
          \t\t).
          \t\tWillReturnResult(sqlmock.NewResult(1, 1))
          \tif err := store.UpsertAutomationRule(context.Background(), rule); err != nil {
          '''
          new = '''\tmock.ExpectExec("INSERT INTO communityplus_automation_rules").
          \t\tWithArgs(
          \t\t\trule.ID, rule.Name, ScopeFleet, uint(12), rule.Trigger, rule.Action,
          \t\t\ttrue, sqlmock.AnyArg(), sqlmock.AnyArg(),
          \t\t).
          \t\tWillReturnResult(sqlmock.NewResult(1, 1))
          \tmock.ExpectQuery("SELECT scope_kind, fleet_id FROM communityplus_automation_rules").
          \t\tWithArgs(rule.ID).
          \t\tWillReturnRows(sqlmock.NewRows([]string{"scope_kind", "fleet_id"}).AddRow(ScopeFleet, 12))
          \tif err := store.UpsertAutomationRule(context.Background(), rule); err != nil {
          '''
          if old not in text:
              raise SystemExit('automation success expectation not found')
          text = text.replace(old, new, 1)
          text += r'''

          func TestSQLStoreRejectsAutomationRuleScopeChange(t *testing.T) {
          	db, mock, err := sqlmock.New()
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer db.Close()
          	store, err := NewSQLStore(db)
          	if err != nil {
          		t.Fatal(err)
          	}
          	rule := AutomationRule{
          		ID: "shared-id", Name: "Fleet 12 rule", Scope: FleetScope(12),
          		Trigger: TriggerPolicyFailed, Action: AutomationNotify, Enabled: true,
          	}
          	mock.ExpectExec("name = IF\\(scope_kind = VALUES\\(scope_kind\\) AND fleet_id <=> VALUES\\(fleet_id\\)").
          		WithArgs(rule.ID, rule.Name, ScopeFleet, uint(12), rule.Trigger, rule.Action, true, sqlmock.AnyArg(), sqlmock.AnyArg()).
          		WillReturnResult(sqlmock.NewResult(0, 0))
          	mock.ExpectQuery("SELECT scope_kind, fleet_id FROM communityplus_automation_rules").
          		WithArgs(rule.ID).
          		WillReturnRows(sqlmock.NewRows([]string{"scope_kind", "fleet_id"}).AddRow(ScopeFleet, 13))
          	err = store.UpsertAutomationRule(context.Background(), rule)
          	if !errors.Is(err, ErrScopeConflict) {
          		t.Fatalf("expected ErrScopeConflict, got %v", err)
          	}
          	if err := mock.ExpectationsWereMet(); err != nil {
          		t.Fatal(err)
          	}
          }

          func TestSQLStoreRejectsDeploymentScopeChange(t *testing.T) {
          	db, mock, err := sqlmock.New()
          	if err != nil {
          		t.Fatal(err)
          	}
          	defer db.Close()
          	store, err := NewSQLStore(db)
          	if err != nil {
          		t.Fatal(err)
          	}
          	deployment := Deployment{
          		ID: "shared-deployment", CatalogEntryID: "entry-1", Scope: FleetScope(7),
          		Automatic: true, CreatedAt: time.Now().UTC(), CreatedBy: "user-7",
          	}
          	mock.ExpectExec("catalog_entry_id = IF\\(fleet_id = VALUES\\(fleet_id\\)").
          		WithArgs(deployment.ID, deployment.CatalogEntryID, uint(7), false, true, false, deployment.CreatedAt, deployment.CreatedBy).
          		WillReturnResult(sqlmock.NewResult(0, 0))
          	mock.ExpectQuery("SELECT fleet_id FROM communityplus_catalog_deployments").
          		WithArgs(deployment.ID).
          		WillReturnRows(sqlmock.NewRows([]string{"fleet_id"}).AddRow(8))
          	err = store.UpsertDeployment(context.Background(), deployment)
          	if !errors.Is(err, ErrScopeConflict) {
          		t.Fatalf("expected ErrScopeConflict, got %v", err)
          	}
          	if err := mock.ExpectationsWereMet(); err != nil {
          		t.Fatal(err)
          	}
          }
          '''
          tests.write_text(text)

          http_tests = Path('server/communityplus/httpapi_test.go')
          text = http_tests.read_text()
          old = '''\t\t{ErrUnauthenticated, http.StatusUnauthorized},
          \t\t{ErrForbidden, http.StatusForbidden},
          \t\t{errors.New("invalid value"), http.StatusBadRequest},
          '''
          new = '''\t\t{ErrUnauthenticated, http.StatusUnauthorized},
          \t\t{ErrForbidden, http.StatusForbidden},
          \t\t{ErrScopeConflict, http.StatusConflict},
          \t\t{errors.New("invalid value"), http.StatusBadRequest},
          '''
          if old not in text:
              raise SystemExit('HTTP error status test block not found')
          http_tests.write_text(text.replace(old, new, 1))
          PY
      - name: Format files
        run: gofmt -w server/communityplus/sqlstore.go server/communityplus/sqlstore_test.go server/communityplus/httpapi.go server/communityplus/httpapi_test.go server/communityplus/scope_conflict.go
      - name: Commit scope isolation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/communityplus/sqlstore.go server/communityplus/sqlstore_test.go server/communityplus/httpapi.go server/communityplus/httpapi_test.go server/communityplus/scope_conflict.go
          git diff --cached --quiet || git commit -m 'fix: enforce immutable Community+ Fleet scopes'
          git push origin HEAD:community-plus/foundation
