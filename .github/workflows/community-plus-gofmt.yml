name: Community+ gofmt repair

on:
  push:
    branches:
      - community-plus/foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format Community+ Go sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find server/communityplus orbit/pkg/communityplus -name '*.go' -type f -print)
          files+=(server/fleet/communityplus_orbit.go)
          gofmt -w "${files[@]}"
      - name: Commit formatting repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/communityplus orbit/pkg/communityplus server/fleet/communityplus_orbit.go
          git commit -m 'gofmt Community+ sources'
          git push origin HEAD:community-plus/foundation
