name: Community+ JIT integration patch

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - .github/workflows/communityplus-jit-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - name: Apply clean-room JIT integration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          appconfig = Path("server/service/appconfig.go")
          text = appconfig.read_text()
          old = '''\t\tif !lic.IsPremium() {\n\t\t\tif p.SSOSettings.EnableJITProvisioning {\n\t\t\t\tinvalid.Append("enable_jit_provisioning", ErrMissingLicense.Error())\n\t\t\t}\n\t\t}\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one SAML JIT license gate")
          appconfig.write_text(text.replace(old, "", 1))

          sessions = Path("server/service/sessions.go")
          text = sessions.read_text()
          old = '''func (svc *Service) GetSSOUser(ctx context.Context, auth fleet.Auth) (*fleet.User, error) {\n\tuser, err := svc.ds.UserByEmail(ctx, auth.UserID())\n\tif err != nil {\n\t\tvar nfe endpointer.NotFoundErrorInterface\n\t\tif errors.As(err, &nfe) {\n\t\t\treturn nil, ctxerr.Wrap(ctx, newSSOError(err, ssoAccountInvalid))\n\t\t}\n\t\treturn nil, ctxerr.Wrap(ctx, err, "find user in sso callback")\n\t}\n\treturn user, nil\n}\n'''
          new = '''func (svc *Service) GetSSOUser(ctx context.Context, auth fleet.Auth) (*fleet.User, error) {\n\tappConfig, err := svc.ds.AppConfig(ctx)\n\tif err != nil {\n\t\treturn nil, ctxerr.Wrap(ctx, err, "get config for Community+ sso user")\n\t}\n\tenableJIT := appConfig.SSOSettings != nil && appConfig.SSOSettings.EnableJITProvisioning\n\treturn svc.CommunityPlusGetSSOUser(ctx, auth, enableJIT)\n}\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one core GetSSOUser implementation")
          sessions.write_text(text.replace(old, new, 1))
          PY

          gofmt -w server/service/sessions.go server/service/communityplus_jit.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/service/appconfig.go server/service/sessions.go server/service/communityplus_jit.go
          git commit -m "feat: enable Community+ JIT for SAML SSO"
          git push origin HEAD:community-plus/foundation
