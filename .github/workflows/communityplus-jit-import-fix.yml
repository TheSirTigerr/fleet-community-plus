name: Community+ JIT import cleanup

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - .github/workflows/communityplus-jit-import-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - name: Remove stale sessions import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("server/service/sessions.go")
          text = path.read_text()
          old = '\t"github.com/fleetdm/fleet/v4/server/platform/endpointer"\n'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale endpointer import")
          path.write_text(text.replace(old, "", 1))
          PY
          gofmt -w server/service/sessions.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/service/sessions.go
          git commit -m "fix: remove stale SSO endpointer import"
          git push origin HEAD:community-plus/foundation
