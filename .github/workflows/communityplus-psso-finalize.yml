name: Community+ PSSO finalize

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-psso-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Ungate and verify Community+ Apple PSSO
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/service/appconfig.go')
          text = p.read_text()
          old = (
              '\t\taapProvided := incomingAAP.OAuthIdPTokenURL.Set || incomingAAP.OAuthIdPClientID.Set || incomingAAP.OAuthIdPClientSecret.Set\n'
              '\t\tif aapProvided && !lic.IsPremium() {\n'
              '\t\t\tinvalid.Append("mdm.apple_account_provisioning", ErrMissingLicense.Error())\n'
              '\t\t}\n'
          )
          actual = text.count(old)
          if actual != 1:
              raise SystemExit(f'expected exactly one Apple account provisioning Premium gate, got {actual}')
          p.write_text(text.replace(old, ''))
          PY
          gofmt -w server/service/appconfig.go server/communityplus/applepsso/*.go server/communityplus/servicecompat/apple_psso.go
          git diff --check
          go test ./server/communityplus/applepsso ./server/communityplus/servicecompat
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Commit verified PSSO finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/appconfig.go server/communityplus/applepsso server/communityplus/servicecompat/apple_psso.go
          git commit -m 'feat: enable Community+ Apple account password sync'
          git push origin HEAD:community-plus/foundation
