name: Community+ configuration profile fleet scope v4

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-config-profiles-fleet-scope-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply final fleet-scope patch and regression updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/communityplus-config-profiles-fleet-scope-v3.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          exec(compile(textwrap.dedent(source[start:end]), 'fleet-scope-v3', 'exec'))

          p = Path('server/service/mdm_test.go')
          text = p.read_text()
          fn_start = text.index('func TestMDMBatchSetProfiles')
          fn_end = text.index('\nfunc ', fn_start + 1)
          chunk = text[fn_start:fn_end]

          old_lookup = (
              '\tds.TeamByNameFunc = func(ctx context.Context, name string) (*fleet.Team, error) {\n'
              '\t\treturn &fleet.Team{ID: 1, Name: name}, nil\n'
              '\t}\n'
          )
          if chunk.count(old_lookup) != 1:
              raise SystemExit(f'TestMDMBatchSetProfiles: expected TeamByName fixture once, got {chunk.count(old_lookup)}')
          new_lookup = old_lookup + (
              '\tds.TeamLiteFunc = func(ctx context.Context, id uint) (*fleet.TeamLite, error) {\n'
              '\t\treturn &fleet.TeamLite{ID: id, Name: "team"}, nil\n'
              '\t}\n'
          )
          chunk = chunk.replace(old_lookup, new_lookup, 1)

          for name in ('team id with free license', 'team name with free license'):
              case_start = chunk.find(f'\t\t{{\n\t\t\t"{name}",\n')
              if case_start < 0:
                  raise SystemExit(f'missing generic batch case: {name}')
              err_pos = chunk.find('\t\t\tErrMissingLicense.Error(),\n', case_start)
              if err_pos < 0:
                  raise SystemExit(f'missing old generic batch license expectation: {name}')
              chunk = chunk[:err_pos] + '\t\t\t"",\n' + chunk[err_pos + len('\t\t\tErrMissingLicense.Error(),\n'):]

          p.write_text(text[:fn_start] + chunk + text[fn_end:])
          PY
          gofmt -w server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git diff --check
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Verify fleet-scope profile changes
        shell: bash
        run: |
          set -euo pipefail
          go test ./server/communityplus/servicecompat -count=1
          go test ./server/service -run 'Test.*MDM.*Profile|TestMDMBatchSetProfiles|TestUploadWindowsMDMConfigProfileValidations|TestMDMBatchSetAppleProfiles|TestDeleteMDMConfigProfileFreeLicenseTeam' -count=1
          go build ./cmd/fleet
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git commit -m 'feat: enable Community+ configuration profile fleet scope'
          git push origin HEAD:community-plus/foundation
