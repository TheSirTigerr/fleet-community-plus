name: Community+ configuration profile fleet scope v4

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-config-profiles-fleet-scope-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply consolidated fleet-scope patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/communityplus-config-profiles-fleet-scope-v3.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          exec(compile(textwrap.dedent(source[start:end]), 'fleet-scope-v3', 'exec'))

          def add_team_lite_after_team_with_extras(function_name, indent):
              p = Path('server/service/mdm_test.go')
              text = p.read_text()
              start = text.index(f'func {function_name}')
              end = text.index('\nfunc ', start + 1)
              chunk = text[start:end]
              i = '\t' * indent
              old = (
                  f'{i}ds.TeamWithExtrasFunc = func(ctx context.Context, tid uint) (*fleet.Team, error) {{\n'
                  f'{i}\treturn &fleet.Team{{ID: tid, Name: "team1"}}, nil\n'
                  f'{i}}}\n'
              )
              old_multiline = (
                  f'{i}ds.TeamWithExtrasFunc = func(ctx context.Context, tid uint) (*fleet.Team, error) {{\n'
                  f'{i}\treturn &fleet.Team{{\n'
                  f'{i}\t\tID:   tid,\n'
                  f'{i}\t\tName: "team1",\n'
                  f'{i}\t}}, nil\n'
                  f'{i}}}\n'
              )
              if chunk.count(old) == 1:
                  fixture = old
              elif chunk.count(old_multiline) == 1:
                  fixture = old_multiline
              else:
                  raise SystemExit(f'unexpected TeamWithExtras fixture count in {function_name}')
              new = fixture + (
                  f'{i}ds.TeamLiteFunc = func(ctx context.Context, tid uint) (*fleet.TeamLite, error) {{\n'
                  f'{i}\treturn &fleet.TeamLite{{ID: tid, Name: "team1"}}, nil\n'
                  f'{i}}}\n'
              )
              chunk = chunk.replace(fixture, new, 1)
              p.write_text(text[:start] + chunk + text[end:])

          # Existing label and OS-update batch coverage use fleet_id=1 and now
          # pass through direct TeamLite resolution. Their feature semantics
          # remain unchanged; only provide the lookup fixture.
          add_team_lite_after_team_with_extras('TestBatchSetMDMProfilesLabels', 1)
          add_team_lite_after_team_with_extras('TestBatchSetMDMProfilesOSUpdates', 3)
          PY
          gofmt -w server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git diff --check
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Verify fleet-scope profile changes
        shell: bash
        run: |
          set -euo pipefail
          go test ./server/communityplus/servicecompat -count=1
          go test ./server/service -run 'Test.*MDM.*Profile|TestMDMBatchSetProfiles|TestBatchSetMDMProfilesLabels|TestBatchSetMDMProfilesOSUpdates|TestUploadWindowsMDMConfigProfileValidations|TestMDMBatchSetAppleProfiles|TestDeleteMDMConfigProfileFreeLicenseTeam' -count=1
          go build ./cmd/fleet
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git commit -m 'feat: enable Community+ configuration profile fleet scope'
          git push origin HEAD:community-plus/foundation
