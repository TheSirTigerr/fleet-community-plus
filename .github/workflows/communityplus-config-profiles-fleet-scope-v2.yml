name: Community+ configuration profile fleet scope v2

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-config-profiles-fleet-scope-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply guarded fleet-scope changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          # Reuse the already-reviewed Apple/Windows/resolve-profile patch from
          # the first guarded workflow, but do not run that workflow separately.
          source = Path('.github/workflows/communityplus-config-profiles-ungate.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          exec(compile(textwrap.dedent(source[start:end]), 'base-profile-scope-patch', 'exec'))

          def function_chunk(path, marker):
              p = Path(path)
              text = p.read_text()
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{path}: missing marker {marker}')
              end = text.find('\nfunc ', start + len(marker))
              if end < 0:
                  end = len(text)
              return p, text, start, end, text[start:end]

          def replace_in_function(path, marker, old, new):
              p, text, start, end, chunk = function_chunk(path, marker)
              actual = chunk.count(old)
              if actual != 1:
                  raise SystemExit(f'{path} {marker}: expected 1 match, got {actual}')
              chunk = chunk.replace(old, new, 1)
              p.write_text(text[:start] + chunk + text[end:])

          # Batch/GitOps must resolve fleet/team scope without the Premium-only
          # EnterpriseOverrides callback. Keep label scoping gated separately.
          old_batch = (
              "\tif tmID != nil || tmName != nil {\n"
              "\t\tlicense, _ := license.FromContext(ctx)\n"
              "\t\tif !license.IsPremium() {\n"
              "\t\t\tfield := \"team_id\"\n"
              "\t\t\tif tmName != nil {\n"
              "\t\t\t\tfield = \"team_name\"\n"
              "\t\t\t}\n"
              "\t\t\tsvc.authz.SkipAuthorization(ctx) // so that the error message is not replaced by \"forbidden\"\n"
              "\t\t\treturn nil, nil, ctxerr.Wrap(ctx, fleet.NewInvalidArgumentError(field, ErrMissingLicense.Error()))\n"
              "\t\t}\n"
              "\t}\n\n"
              "\t// if the team name is provided, load the corresponding team to get its id.\n"
              "\t// vice-versa, if the id is provided, load it to get the name (required for\n"
              "\t// the activity).\n"
              "\tif tmName != nil || tmID != nil {\n"
              "\t\ttm, err := svc.EnterpriseOverrides.TeamByIDOrName(ctx, tmID, tmName)\n"
              "\t\tif err != nil {\n"
              "\t\t\treturn nil, nil, err\n"
              "\t\t}\n"
              "\t\tif tmID == nil {\n"
              "\t\t\ttmID = &tm.ID\n"
              "\t\t} else {\n"
              "\t\t\ttmName = &tm.Name\n"
              "\t\t}\n"
              "\t}\n"
          )
          new_batch = (
              "\t// Resolve the fleet/team directly through the Community datastore.\n"
              "\t// Label targeting remains a separate capability and is validated later.\n"
              "\tif tmID != nil {\n"
              "\t\ttm, err := svc.ds.TeamLite(ctx, *tmID)\n"
              "\t\tif err != nil {\n"
              "\t\t\treturn nil, nil, err\n"
              "\t\t}\n"
              "\t\ttmName = &tm.Name\n"
              "\t} else if tmName != nil {\n"
              "\t\ttm, err := svc.ds.TeamByName(ctx, *tmName)\n"
              "\t\tif err != nil {\n"
              "\t\t\treturn nil, nil, err\n"
              "\t\t}\n"
              "\t\ttmID = &tm.ID\n"
              "\t\ttmName = &tm.Name\n"
              "\t}\n"
          )
          replace_in_function(
              'server/service/mdm.go',
              'func (svc *Service) authorizeBatchProfiles',
              old_batch,
              new_batch,
          )

          # The Windows create-validation matrix now reaches TeamLite on free
          # licenses too, so its shared test setup needs the lightweight lookup.
          old_lookup = (
              "\t\tds.TeamWithExtrasFunc = func(ctx context.Context, teamID uint) (*fleet.Team, error) {\n"
              "\t\t\treturn &fleet.Team{ID: teamID, Name: fmt.Sprintf(\"team-%d\", teamID)}, nil\n"
              "\t\t}\n"
          )
          new_lookup = old_lookup + (
              "\t\tds.TeamLiteFunc = func(ctx context.Context, teamID uint) (*fleet.TeamLite, error) {\n"
              "\t\t\treturn &fleet.TeamLite{ID: teamID, Name: fmt.Sprintf(\"team-%d\", teamID)}, nil\n"
              "\t\t}\n"
          )
          replace_in_function(
              'server/service/windows_mdm_profiles_test.go',
              'func TestNewMDMWindowsConfigProfile',
              old_lookup,
              new_lookup,
          )
          PY
          gofmt -w server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go
          git diff --check
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Verify fleet-scope profile changes
        shell: bash
        run: |
          set -euo pipefail
          go test ./server/communityplus/servicecompat -count=1
          go test ./server/service -run 'Test.*MDM.*Profile|TestMDMBatchSetAppleProfiles' -count=1
          go build ./cmd/fleet
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go
          git commit -m 'feat: enable Community+ configuration profile fleet scope'
          git push origin HEAD:community-plus/foundation
