name: Community+ gofmt RBAC

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/community-plus-gofmt-rbac.yml'

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
      - name: Format RBAC files
        run: gofmt -w server/communityplus/rbac.go server/communityplus/viewer_roles.go server/communityplus/routes.go server/communityplus/routes_test.go
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/communityplus/rbac.go server/communityplus/viewer_roles.go server/communityplus/routes.go server/communityplus/routes_test.go
          git diff --cached --quiet || git commit -m 'gofmt Community+ RBAC'
          git push origin HEAD:community-plus/foundation
