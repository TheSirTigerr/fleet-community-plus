name: Community+ Android direct AMAPI gate

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-android-direct-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Enable production direct Google AMAPI client
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/mdm/android/service/service.go')
          text = p.read_text()

          old = 'func newAMAPIClient(ctx context.Context, logger *slog.Logger, licenseKey string) androidmgmt.Client {\n\tvar client androidmgmt.Client\n\tgetEnv := dev_mode.Env\n\tif getEnv("FLEET_DEV_ANDROID_GOOGLE_CLIENT") == "1" || strings.ToUpper(getEnv("FLEET_DEV_ANDROID_GOOGLE_CLIENT")) == "ON" {\n\t\tclient = androidmgmt.NewGoogleClient(ctx, logger, getEnv)\n\t} else {\n\t\tclient = androidmgmt.NewProxyClient(ctx, logger, licenseKey, getEnv)\n\t}\n\treturn client\n}'
          new = 'const communityPlusAndroidGoogleCredentialsEnv = "FLEET_MDM_ANDROID_GOOGLE_SERVICE_CREDENTIALS"\n\ntype amapiGoogleClientFactory func(context.Context, *slog.Logger, dev_mode.GetEnv) androidmgmt.Client\ntype amapiProxyClientFactory func(context.Context, *slog.Logger, string, dev_mode.GetEnv) androidmgmt.Client\n\nfunc newAMAPIClient(ctx context.Context, logger *slog.Logger, licenseKey string) androidmgmt.Client {\n\treturn selectAMAPIClient(ctx, logger, licenseKey, dev_mode.Env, androidmgmt.NewGoogleClient, androidmgmt.NewProxyClient)\n}\n\nfunc selectAMAPIClient(ctx context.Context, logger *slog.Logger, licenseKey string, getEnv dev_mode.GetEnv, googleFactory amapiGoogleClientFactory, proxyFactory amapiProxyClientFactory) androidmgmt.Client {\n\tif credentials := strings.TrimSpace(getEnv(communityPlusAndroidGoogleCredentialsEnv)); credentials != "" {\n\t\tcommunityPlusEnv := func(name string) string {\n\t\t\tif name == "FLEET_DEV_ANDROID_GOOGLE_SERVICE_CREDENTIALS" {\n\t\t\t\treturn credentials\n\t\t\t}\n\t\t\treturn getEnv(name)\n\t\t}\n\t\treturn googleFactory(ctx, logger, communityPlusEnv)\n\t}\n\n\tif getEnv("FLEET_DEV_ANDROID_GOOGLE_CLIENT") == "1" || strings.ToUpper(getEnv("FLEET_DEV_ANDROID_GOOGLE_CLIENT")) == "ON" {\n\t\treturn googleFactory(ctx, logger, getEnv)\n\t}\n\treturn proxyFactory(ctx, logger, licenseKey, getEnv)\n}'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one newAMAPIClient implementation, got {text.count(old)}')
          text = text.replace(old, new, 1)

          needle = ') (android.Service, error) {\n\tauthorizer, err := authz.NewAuthorizer()'
          replacement = ') (android.Service, error) {\n\tif client == nil {\n\t\treturn nil, errors.New("android management API client is not configured")\n\t}\n\n\tauthorizer, err := authz.NewAuthorizer()'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one NewServiceWithClient insertion point, got {text.count(needle)}')
          text = text.replace(needle, replacement, 1)

          p.write_text(text)
          PY

          cat > server/mdm/android/service/communityplus_amapi_client_test.go <<'EOF'
          package service

          import (
              "context"
              "io"
              "log/slog"
              "testing"

              "github.com/fleetdm/fleet/v4/server/dev_mode"
              "github.com/fleetdm/fleet/v4/server/mdm/android/service/androidmgmt"
          )

          func TestCommunityPlusAMAPIClientSelection(t *testing.T) {
              logger := slog.New(slog.NewTextHandler(io.Discard, nil))
              ctx := context.Background()

              t.Run("production credentials select direct Google client", func(t *testing.T) {
                  env := map[string]string{
                      communityPlusAndroidGoogleCredentialsEnv: `{"project_id":"community-plus-project"}`,
                      "FLEET_DEV_ANDROID_GOOGLE_CLIENT":       "OFF",
                  }
                  getEnv := dev_mode.GetEnv(func(name string) string { return env[name] })
                  selected := ""
                  google := func(_ context.Context, _ *slog.Logger, mappedEnv dev_mode.GetEnv) androidmgmt.Client {
                      selected = "google"
                      if got := mappedEnv("FLEET_DEV_ANDROID_GOOGLE_SERVICE_CREDENTIALS"); got != env[communityPlusAndroidGoogleCredentialsEnv] {
                          t.Fatalf("mapped credentials = %q, want production credentials", got)
                      }
                      return nil
                  }
                  proxy := func(context.Context, *slog.Logger, string, dev_mode.GetEnv) androidmgmt.Client {
                      selected = "proxy"
                      return nil
                  }

                  _ = selectAMAPIClient(ctx, logger, "license", getEnv, google, proxy)
                  if selected != "google" {
                      t.Fatalf("selected %q, want google", selected)
                  }
              })

              t.Run("legacy dev direct client remains supported", func(t *testing.T) {
                  env := map[string]string{"FLEET_DEV_ANDROID_GOOGLE_CLIENT": "ON"}
                  getEnv := dev_mode.GetEnv(func(name string) string { return env[name] })
                  selected := ""
                  google := func(context.Context, *slog.Logger, dev_mode.GetEnv) androidmgmt.Client {
                      selected = "google"
                      return nil
                  }
                  proxy := func(context.Context, *slog.Logger, string, dev_mode.GetEnv) androidmgmt.Client {
                      selected = "proxy"
                      return nil
                  }

                  _ = selectAMAPIClient(ctx, logger, "license", getEnv, google, proxy)
                  if selected != "google" {
                      t.Fatalf("selected %q, want google", selected)
                  }
              })

              t.Run("proxy remains fallback", func(t *testing.T) {
                  getEnv := dev_mode.GetEnv(func(string) string { return "" })
                  selected := ""
                  google := func(context.Context, *slog.Logger, dev_mode.GetEnv) androidmgmt.Client {
                      selected = "google"
                      return nil
                  }
                  proxy := func(_ context.Context, _ *slog.Logger, licenseKey string, _ dev_mode.GetEnv) androidmgmt.Client {
                      selected = "proxy"
                      if licenseKey != "license" {
                          t.Fatalf("license key = %q, want license", licenseKey)
                      }
                      return nil
                  }

                  _ = selectAMAPIClient(ctx, logger, "license", getEnv, google, proxy)
                  if selected != "proxy" {
                      t.Fatalf("selected %q, want proxy", selected)
                  }
              })
          }
          EOF

          count="$(grep -R --include='*.go' -F 'newAMAPIClient(' server/mdm/android/service | wc -l | tr -d ' ')"
          if [ "$count" -lt 4 ]; then
            echo "expected at least 4 AMAPI client factory usages, got $count"
            exit 1
          fi

          gofmt -w server/mdm/android/service/service.go server/mdm/android/service/communityplus_amapi_client_test.go
          git diff --check
          go test ./server/mdm/android/service -run '^TestCommunityPlusAMAPIClientSelection$' -count=1
          go test ./server/mdm/android/service/androidmgmt -count=1
          go build ./cmd/fleet

          git rm .github/workflows/communityplus-android-direct-gate.yml

      - name: Commit verified Android direct-AMAPI support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mdm/android/service/service.go server/mdm/android/service/communityplus_amapi_client_test.go .github/workflows/communityplus-android-direct-gate.yml
          git commit -m 'feat: enable Community+ direct Android Management API'
          git push origin HEAD:community-plus/foundation
