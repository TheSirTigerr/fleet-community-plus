name: Community+ conditional access ungate

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-condaccess-ungate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - name: Remove only conditional-access Premium gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def exact_replace(path, old, new, count):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, got {actual}")
              p.write_text(text.replace(old, new))

          p = Path('server/service/conditional_access_microsoft.go')
          text = p.read_text()
          text = text.replace('\t"github.com/fleetdm/fleet/v4/server/contexts/license"\n', '')
          gates = [
              ('\n\tif lic, _ := license.FromContext(ctx); lic == nil || !lic.IsPremium() {\n\t\treturn "", fleet.ErrMissingLicense\n\t}\n', 1),
              ('\n\tif lic, _ := license.FromContext(ctx); lic == nil || !lic.IsPremium() {\n\t\treturn false, "", fleet.ErrMissingLicense\n\t}\n', 1),
              ('\n\tif lic, _ := license.FromContext(ctx); lic == nil || !lic.IsPremium() {\n\t\treturn fleet.ErrMissingLicense\n\t}\n', 1),
              ('\n\tif lic, _ := license.FromContext(ctx); lic == nil || !lic.IsPremium() {\n\t\treturn nil, nil\n\t}\n', 1),
          ]
          for old, expected in gates:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'conditional_access_microsoft.go: expected {expected} matches, got {actual}')
              text = text.replace(old, '')
          p.write_text(text)

          exact_replace(
              'server/service/osquery.go',
              '\t// Conditional access is a Fleet Premium feature. Gate on the current license\n\t// tier so that an integration left over from a previous Premium license\n\t// (e.g. after a downgrade or expiry) doesn\'t keep the feature active.\n\tif !license.IsPremium(ctx) {\n\t\treturn false, false, nil\n\t}\n\n',
              '\t// Community+ controls conditional-access availability independently of Fleet\'s license tier.\n',
              1,
          )

          exact_replace(
              'server/service/appconfig.go',
              '\tif oktaFieldsBeingSet && !lic.IsPremium() {\n\t\tinvalid.Append("conditional_access", ErrMissingLicense.Error())\n\t\treturn ctxerr.Wrap(ctx, invalid)\n\t}\n\n',
              '',
              1,
          )
          PY
          gofmt -w server/service/conditional_access_microsoft.go server/service/osquery.go server/service/appconfig.go
          git diff --check
          git diff --exit-code --quiet && { echo 'No patch produced'; exit 1; }
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/conditional_access_microsoft.go server/service/osquery.go server/service/appconfig.go
          git commit -m 'feat: enable Community+ conditional access services'
          git push origin HEAD:community-plus/foundation
