name: Community+ configuration profile fleet scope v3

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-config-profiles-fleet-scope-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply final guarded fleet-scope changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source = Path('.github/workflows/communityplus-config-profiles-fleet-scope-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          exec(compile(textwrap.dedent(source[start:end]), 'fleet-scope-v2', 'exec'))

          # Free/Community+ fleet scope is now supported, so these legacy
          # Apple batch matrix cases must expect success rather than ErrMissingLicense.
          p = Path('server/service/apple_mdm_test.go')
          text = p.read_text()
          fn_start = text.index('func TestMDMBatchSetAppleProfiles')
          fn_end = text.index('\nfunc ', fn_start + 1)
          chunk = text[fn_start:fn_end]
          for name in ('team id with free license', 'team name with free license'):
              case_start = chunk.find(f'\t\t{{\n\t\t\t"{name}",\n')
              if case_start < 0:
                  raise SystemExit(f'missing Apple batch case: {name}')
              err_pos = chunk.find('\t\t\tErrMissingLicense.Error(),\n', case_start)
              if err_pos < 0:
                  raise SystemExit(f'missing old license expectation: {name}')
              chunk = chunk[:err_pos] + '\t\t\t"",\n' + chunk[err_pos + len('\t\t\tErrMissingLicense.Error(),\n'):]
          p.write_text(text[:fn_start] + chunk + text[fn_end:])

          # The unified Apple/Windows/Android batch path now resolves fleet IDs
          # through TeamLite as well. Add that fixture and update its legacy
          # Free-license expectations to success.
          p = Path('server/service/mdm_test.go')
          text = p.read_text()
          fn_start = text.index('func TestMDMBatchSetProfiles')
          fn_end = text.index('\nfunc ', fn_start + 1)
          chunk = text[fn_start:fn_end]
          old_team_fixture = (
              '\tds.TeamByNameFunc = func(ctx context.Context, name string) (*fleet.Team, error) {\n'
              '\t\treturn &fleet.Team{ID: 1, Name: name}, nil\n'
              '\t}\n'
          )
          if chunk.count(old_team_fixture) != 1:
              raise SystemExit('unexpected TeamByName fixture count in TestMDMBatchSetProfiles')
          new_team_fixture = old_team_fixture + (
              '\tds.TeamLiteFunc = func(ctx context.Context, id uint) (*fleet.TeamLite, error) {\n'
              '\t\treturn &fleet.TeamLite{ID: id, Name: "team"}, nil\n'
              '\t}\n'
          )
          chunk = chunk.replace(old_team_fixture, new_team_fixture, 1)
          for name in ('team id with free license', 'team name with free license'):
              case_start = chunk.find(f'\t\t{{\n\t\t\t"{name}",\n')
              if case_start < 0:
                  raise SystemExit(f'missing unified batch case: {name}')
              err_pos = chunk.find('\t\t\tErrMissingLicense.Error(),\n', case_start)
              if err_pos < 0:
                  raise SystemExit(f'missing unified batch license expectation: {name}')
              chunk = chunk[:err_pos] + '\t\t\t"",\n' + chunk[err_pos + len('\t\t\tErrMissingLicense.Error(),\n'):]
          p.write_text(text[:fn_start] + chunk + text[fn_end:])

          # Existing label batch coverage uses a team ID. Fleet-scope resolution
          # now happens through TeamLite before label validation, so mirror the
          # test's TeamWithExtras fixture without changing label licensing yet.
          p = Path('server/service/mdm_test.go')
          text = p.read_text()
          fn_start = text.index('func TestBatchSetMDMProfilesLabels')
          fn_end = text.index('\nfunc ', fn_start + 1)
          chunk = text[fn_start:fn_end]
          old_labels_team = (
              '\tds.TeamWithExtrasFunc = func(ctx context.Context, tid uint) (*fleet.Team, error) {\n'
              '\t\treturn &fleet.Team{\n'
              '\t\t\tID:   tid,\n'
              '\t\t\tName: "team1",\n'
              '\t\t}, nil\n'
              '\t}\n'
          )
          if chunk.count(old_labels_team) != 1:
              raise SystemExit(f'TestBatchSetMDMProfilesLabels: expected TeamWithExtras fixture once, got {chunk.count(old_labels_team)}')
          new_labels_team = old_labels_team + (
              '\tds.TeamLiteFunc = func(ctx context.Context, tid uint) (*fleet.TeamLite, error) {\n'
              '\t\treturn &fleet.TeamLite{ID: tid, Name: "team1"}, nil\n'
              '\t}\n'
          )
          chunk = chunk.replace(old_labels_team, new_labels_team, 1)
          p.write_text(text[:fn_start] + chunk + text[fn_end:])

          # OS-update batch coverage also uses a team ID. Match indentation
          # dynamically because the fixture lives inside the table-test loop.
          p = Path('server/service/mdm_test.go')
          text = p.read_text()
          fn_start = text.index('func TestBatchSetMDMProfilesOSUpdates')
          fn_end = text.index('\nfunc ', fn_start + 1)
          chunk = text[fn_start:fn_end]
          pattern = re.compile(
              r'(?P<indent>[\t ]*)ds\.TeamWithExtrasFunc = func\(ctx context\.Context, tid uint\) \(\*fleet\.Team, error\) \{\n'
              r'(?P=indent)\treturn &fleet\.Team\{ID: tid, Name: "team1"\}, nil\n'
              r'(?P=indent)\}'
          )
          match = pattern.search(chunk)
          if not match:
              raise SystemExit('TestBatchSetMDMProfilesOSUpdates: TeamWithExtras fixture not found')
          indent = match.group('indent')
          replacement = match.group(0) + (
              f'\n{indent}ds.TeamLiteFunc = func(ctx context.Context, tid uint) (*fleet.TeamLite, error) {{\n'
              f'{indent}\treturn &fleet.TeamLite{{ID: tid, Name: "team1"}}, nil\n'
              f'{indent}}}'
          )
          chunk = chunk[:match.start()] + replacement + chunk[match.end():]
          p.write_text(text[:fn_start] + chunk + text[fn_end:])

          # Team-scoped profile deletes are valid on Free/Community+ too.
          p = Path('server/service/mdm_test.go')
          text = p.read_text()
          start = text.index('func TestDeleteMDMConfigProfileFreeLicenseTeam')
          end = text.index('\nfunc ', start + 1)
          lines = [
              'func TestDeleteMDMConfigProfileFreeLicenseTeam(t *testing.T) {',
              '\tsvc, ctx, ds, _ := setupAppleMDMService(t, &fleet.LicenseInfo{Tier: fleet.TierFree})',
              '\tctx = viewer.NewContext(ctx, viewer.Viewer{User: &fleet.User{GlobalRole: new(fleet.RoleAdmin)}})',
              '\tteamID := uint(5)',
              '',
              '\tds.TeamLiteFunc = func(ctx context.Context, tid uint) (*fleet.TeamLite, error) {',
              '\t\trequire.Equal(t, teamID, tid)',
              '\t\treturn &fleet.TeamLite{ID: tid, Name: "team5"}, nil',
              '\t}',
              '\tds.DeleteMDMWindowsConfigProfileFunc = func(context.Context, string) error { return nil }',
              '\tds.DeleteMDMAndroidConfigProfileFunc = func(context.Context, string) error { return nil }',
              '\tds.DeleteMDMAppleConfigProfileFunc = func(context.Context, string) error { return nil }',
              '\tds.DeleteMDMAppleDeclarationFunc = func(context.Context, string) error { return nil }',
              '',
              '\tds.GetMDMWindowsConfigProfileFunc = func(ctx context.Context, puid string) (*fleet.MDMWindowsConfigProfile, error) {',
              '\t\treturn &fleet.MDMWindowsConfigProfile{ProfileUUID: puid, Name: "Test Profile", TeamID: &teamID}, nil',
              '\t}',
              '\trequire.NoError(t, svc.DeleteMDMWindowsConfigProfile(ctx, "w"+uuid.NewString()))',
              '',
              '\tds.GetMDMAndroidConfigProfileFunc = func(ctx context.Context, puid string) (*fleet.MDMAndroidConfigProfile, error) {',
              '\t\treturn &fleet.MDMAndroidConfigProfile{ProfileUUID: puid, Name: "Test Profile", TeamID: &teamID}, nil',
              '\t}',
              '\trequire.NoError(t, svc.DeleteMDMAndroidConfigProfile(ctx, "g"+uuid.NewString()))',
              '',
              '\tds.GetMDMAppleConfigProfileFunc = func(ctx context.Context, puid string) (*fleet.MDMAppleConfigProfile, error) {',
              '\t\treturn &fleet.MDMAppleConfigProfile{ProfileUUID: puid, Identifier: "com.fleetdm.test", Name: "Test Profile", TeamID: &teamID}, nil',
              '\t}',
              '\trequire.NoError(t, svc.DeleteMDMAppleConfigProfile(ctx, "a"+uuid.NewString()))',
              '',
              '\tds.GetMDMAppleDeclarationFunc = func(ctx context.Context, duid string) (*fleet.MDMAppleDeclaration, error) {',
              '\t\treturn &fleet.MDMAppleDeclaration{',
              '\t\t\tDeclarationUUID: duid,',
              '\t\t\tIdentifier:      "com.fleet.configD1",',
              '\t\t\tName:            "Test Declaration",',
              '\t\t\tTeamID:          &teamID,',
              '\t\t\tRawJSON:         declBytesForTest("D1", "d1content"),',
              '\t\t}, nil',
              '\t}',
              '\trequire.NoError(t, svc.DeleteMDMAppleDeclaration(ctx, "d"+uuid.NewString()))',
              '}',
              '',
          ]
          replacement = '\n'.join(lines)
          p.write_text(text[:start] + replacement + text[end:])
          PY
          gofmt -w server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git diff --check
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Verify fleet-scope profile changes
        shell: bash
        run: |
          set -euo pipefail
          go test ./server/communityplus/servicecompat -count=1
          go test ./server/service -run 'Test.*MDM.*Profile|TestUploadWindowsMDMConfigProfileValidations|TestMDMBatchSetAppleProfiles|TestMDMBatchSetProfiles|TestBatchSetMDMProfilesLabels|TestBatchSetMDMProfilesOSUpdates|TestDeleteMDMConfigProfileFreeLicenseTeam' -count=1
          go build ./cmd/fleet
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/apple_mdm.go server/service/windows_mdm_profiles.go server/service/mdm.go server/service/apple_mdm_test.go server/service/windows_mdm_profiles_test.go server/service/mdm_test.go
          git commit -m 'feat: enable Community+ configuration profile fleet scope'
          git push origin HEAD:community-plus/foundation
