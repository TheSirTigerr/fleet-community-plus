name: Community+ ADUE SSO gate

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-adue-sso-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Enable Community+ ADUE SSO core callbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/service/apple_mdm.go')
          text = p.read_text()

          initiate_pattern = re.compile(
              r'func \(svc \*Service\) InitiateMDMSSO\(ctx context\.Context, initiator, customOriginalURL string, hostUUID string\) '
              r'\(sessionID string, sessionDurationSeconds int, idpURL string, err error\) \{\n'
              r'(?:(?!\n\}).)*\n\}',
              re.S,
          )
          initiate_replacement = '''func (svc *Service) InitiateMDMSSO(ctx context.Context, initiator, customOriginalURL string, hostUUID string) (sessionID string, sessionDurationSeconds int, idpURL string, err error) {
\treturn svc.communityPlusInitiateMDMSSO(ctx, initiator, customOriginalURL, hostUUID)
}'''
          text, count = initiate_pattern.subn(initiate_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one InitiateMDMSSO stub, got {count}')

          callback_pattern = re.compile(
              r'func \(svc \*Service\) MDMSSOCallback\(ctx context\.Context, sessionID string, samlResponse \[\]byte\) '
              r'\(redirectURL, byodCookieValue, deviceSSOSessionID string, deviceSSOSessionDurationSeconds int\) \{\n'
              r'(?:(?!\n\}).)*\n\}',
              re.S,
          )
          callback_replacement = '''func (svc *Service) MDMSSOCallback(ctx context.Context, sessionID string, samlResponse []byte) (redirectURL, byodCookieValue, deviceSSOSessionID string, deviceSSOSessionDurationSeconds int) {
\treturn svc.communityPlusMDMSSOCallback(ctx, sessionID, samlResponse)
}'''
          text, count = callback_pattern.subn(callback_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one MDMSSOCallback stub, got {count}')

          p.write_text(text)
          PY
          gofmt -w server/service/apple_mdm.go server/service/communityplus_adue_sso.go
          git diff --check
          go test ./server/communityplus/adue ./server/communityplus/servicecompat
          go test ./server/service -run 'TestNonExistent' -count=0
          go build ./cmd/fleet
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Commit verified ADUE SSO patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/apple_mdm.go server/service/communityplus_adue_sso.go
          git commit -m 'feat: enable Community+ ADUE SSO callbacks'
          git push origin HEAD:community-plus/foundation
