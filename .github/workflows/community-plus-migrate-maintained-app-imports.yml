name: Community+ migrate maintained-app imports

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/community-plus-migrate-maintained-app-imports.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace maintained-app EE imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('cmd/maintained-apps/main.go'): {
                  'maintained_apps "github.com/fleetdm/fleet/v4/ee/maintained-apps"': 'maintained_apps "github.com/fleetdm/fleet/v4/server/communityplus/maintainedapps"',
                  '"github.com/fleetdm/fleet/v4/ee/maintained-apps/ingesters/homebrew"': '"github.com/fleetdm/fleet/v4/server/communityplus/maintainedapps/ingesters/homebrew"',
                  '"github.com/fleetdm/fleet/v4/ee/maintained-apps/ingesters/winget"': '"github.com/fleetdm/fleet/v4/server/communityplus/maintainedapps/ingesters/winget"',
                  '"github.com/fleetdm/fleet/v4/ee/maintained-apps/sources"': '"github.com/fleetdm/fleet/v4/server/communityplus/maintainedapps/sources"',
              },
              Path('server/mdm/maintainedapps/sync.go'): {
                  'ma "github.com/fleetdm/fleet/v4/ee/maintained-apps"': 'ma "github.com/fleetdm/fleet/v4/server/communityplus/maintainedapps"',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'{path}: missing expected import: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          gofmt -w cmd/maintained-apps/main.go server/mdm/maintainedapps/sync.go

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd/maintained-apps/main.go server/mdm/maintainedapps/sync.go
          git diff --cached --check
          git commit -m 'refactor: move maintained-app production imports off ee'
          git push origin HEAD:community-plus/foundation
