name: Community+ host naming gate

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-host-naming-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Enable Community+ host naming templates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/service/appconfig.go')
          text = p.read_text()
          old = (
              '\tif mdm.HostNameTemplate.Value != "" && oldMdm.HostNameTemplate.Value != mdm.HostNameTemplate.Value {\n'
              '\t\tif !lic.IsPremium() {\n'
              '\t\t\tinvalid.Append("mdm.name_template", ErrMissingLicense.Error())\n'
              '\t\t} else if validated, err := fleet.ValidateHostNameTemplateWithSecrets(ctx, svc.ds, mdm.HostNameTemplate.Value,\n'
              '\t\t\tsvc.authz.CanWriteSecretVariables(ctx)); err != nil {\n'
          )
          new = (
              '\tif mdm.HostNameTemplate.Value != "" && oldMdm.HostNameTemplate.Value != mdm.HostNameTemplate.Value {\n'
              '\t\t// Community+ implements host naming enforcement independently; keep the\n'
              '\t\t// normal template/secret validation without requiring a Premium token.\n'
              '\t\tif validated, err := fleet.ValidateHostNameTemplateWithSecrets(ctx, svc.ds, mdm.HostNameTemplate.Value,\n'
              '\t\t\tsvc.authz.CanWriteSecretVariables(ctx)); err != nil {\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one host naming license gate, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          gofmt -w server/service/appconfig.go
          git diff --check
          go test ./server/communityplus/... ./server/service -run 'TestNonExistent' -count=0
          go build ./cmd/fleet
          if git diff --quiet; then
            echo 'No patch produced'
            exit 1
          fi
      - name: Commit verified host naming gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/service/appconfig.go
          git commit -m 'fix: allow Community+ host naming templates'
          git push origin HEAD:community-plus/foundation
