name: Community+ disk encryption gate

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/communityplus-disk-encryption-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: community-plus/foundation
          fetch-depth: 0

      - name: Enable Community+ disk encryption runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, got {count}")
              p.write_text(text.replace(old, new))

          replace_exact(
              "server/service/mdm.go",
              "\tlic, _ := license.FromContext(ctx)\n"
              "\tif lic == nil || !lic.IsPremium() {\n"
              "\t\tsvc.authz.SkipAuthorization(ctx) // so that the error message is not replaced by \"forbidden\"\n"
              "\t\treturn fleet.ErrMissingLicense\n"
              "\t}\n\n",
              "",
          )

          replace_exact(
              "server/service/appconfig.go",
              "\tif !lic.IsPremium() {\n"
              "\t\t// gated on newly enabling (not the stored value) so a downgraded\n"
              "\t\t// license with settings still on can save unrelated config changes\n"
              "\t\t// and turn the settings off\n"
              "\t\tif mdm.MacOSSettings.EnableDiskEncryption.Value && !oldMdm.MacOSSettings.EnableDiskEncryption.Value {\n"
              "\t\t\tinvalid.Append(\"apple_settings.enable_disk_encryption\", ErrMissingLicense.Error())\n"
              "\t\t}\n"
              "\t\tif mdm.MacOSSettings.EnableEscrowDiskEncryptionKey.Value && !oldMdm.MacOSSettings.EnableEscrowDiskEncryptionKey.Value {\n"
              "\t\t\tinvalid.Append(\"apple_settings.enable_escrow_disk_encryption_key\", ErrMissingLicense.Error())\n"
              "\t\t}\n"
              "\t\tif mdm.WindowsSettings.EnableDiskEncryption.Value && !oldMdm.WindowsSettings.EnableDiskEncryption.Value {\n"
              "\t\t\tinvalid.Append(\"windows_settings.enable_disk_encryption\", ErrMissingLicense.Error())\n"
              "\t\t}\n"
              "\t\tif mdm.LinuxSettings.EnableEscrowDiskEncryptionKey.Value && !oldMdm.LinuxSettings.EnableEscrowDiskEncryptionKey.Value {\n"
              "\t\t\tinvalid.Append(\"linux_settings.enable_escrow_disk_encryption_key\", ErrMissingLicense.Error())\n"
              "\t\t}\n"
              "\t}\n",
              "",
          )

          p = Path("server/service/hosts.go")
          text = p.read_text()
          start_marker = "\t\t\tif license.IsPremium(ctx) {\n\t\t\t\t// we include disk encryption status only for premium so initialize it to default struct\n"
          end_marker = "\n\t\t\t}\n\n\t\t\tif err := svc.populateManagedLocalAccountStatus"
          if text.count(start_marker) != 1:
              raise SystemExit(f"server/service/hosts.go: expected 1 Windows disk-encryption gate, got {text.count(start_marker)}")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block_end = end + len("\n\t\t\t}\n")
          block = text[start:block_end]
          lines = block.splitlines(keepends=True)
          body = "".join(line[1:] if line.startswith("\t") else line for line in lines[1:-1])
          p.write_text(text[:start] + body + text[block_end:])

          p = Path("cmd/fleet/serve.go")
          text = p.read_text()
          marker = "\tif !license.IsPremium() {\n"
          if text.count(marker) != 1:
              raise SystemExit(f"cmd/fleet/serve.go: expected one Community+ Free block, got {text.count(marker)}")
          pos = text.index(marker)
          tail = text[pos:]
          old = "\t\t\tlogger,\n\t\t\tdepStorage,\n"
          if tail.count(old) != 1:
              raise SystemExit(f"cmd/fleet/serve.go: expected one Community+ options insertion point, got {tail.count(old)}")
          tail = tail.replace(old, "\t\t\tlogger,\n\t\t\tconfig,\n\t\t\tdepStorage,\n", 1)
          p.write_text(text[:pos] + tail)
          PY

          gofmt -w             server/communityplus/diskencryption/*.go             server/communityplus/servicecompat/disk_encryption.go             server/communityplus/servicecompat/overrides.go             server/communityplus/servicecompat/service.go             server/service/mdm.go             server/service/appconfig.go             server/service/hosts.go             cmd/fleet/serve.go

          git diff --check
          if git diff --quiet; then
            echo "No patch produced"
            exit 1
          fi

      - name: Verify Community+ disk encryption
        shell: bash
        run: |
          set -euo pipefail
          go test ./server/communityplus/diskencryption ./server/communityplus/servicecompat
          go test ./server/service -run 'Test(UpdateAppConfigMDMDiskEncryption|UpdateMDMDiskEncryption|MDMDiskEncryption)' -count=1
          go build ./cmd/fleet

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             server/communityplus/diskencryption             server/communityplus/servicecompat             server/service/mdm.go             server/service/appconfig.go             server/service/hosts.go             cmd/fleet/serve.go
          git commit -m 'feat: enable Community+ disk encryption enforcement'
          git push origin HEAD:community-plus/foundation
