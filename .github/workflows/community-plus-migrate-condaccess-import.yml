name: Community+ migrate conditional access import

on:
  push:
    branches:
      - community-plus/foundation
    paths:
      - '.github/workflows/community-plus-migrate-condaccess-import.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace conditional access EE import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cmd/fleet/serve.go')
          text = path.read_text()
          old = '"github.com/fleetdm/fleet/v4/ee/server/service/condaccess"'
          new = '"github.com/fleetdm/fleet/v4/server/communityplus/condaccess"'
          if old not in text:
              raise SystemExit(f'missing expected import: {old}')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w cmd/fleet/serve.go
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmd/fleet/serve.go
          git diff --cached --check
          git commit -m 'refactor: move conditional access import off ee'
          git push origin HEAD:community-plus/foundation
